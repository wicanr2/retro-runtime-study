<text x="320" y="122" font-size="10" fill="#475569">NoteOn／Off・Bend</text>
<text x="320" y="140" font-size="10" fill="#475569">Command</text>
<text x="320" y="158" font-size="10" fill="#475569">Enter／Leave</text>
<text x="320" y="190" font-size="10" fill="#475569">FM・MPU・AWE・GUS</text>
<text x="320" y="230" font-size="10" fill="#475569">＋GSS 借用（前篇）</text>
<rect x="250" y="282" width="140" height="194" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
