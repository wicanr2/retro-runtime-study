<text x="320" y="352" font-size="10" fill="#475569">PlayMode／StopMode</text>
<text x="320" y="370" font-size="10" fill="#475569">Callback 回呼</text>
<text x="320" y="402" font-size="10" fill="#475569">SB・PAS・GUS</text>
<text x="320" y="430" font-size="10" fill="#475569">↓ 取樣走混音管線</text>
<!-- fill arrows -->
<path d="M 210,78 L 246,78" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 210,140 L 246,140" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 210,202 L 246,202" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
