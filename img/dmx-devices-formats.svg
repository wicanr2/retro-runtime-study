<text x="550" y="94" font-size="10" fill="#475569">虛聲道 gVirtChan・平衡表</text>
<text x="550" y="112" font-size="10" fill="#475569">混三味 Mono／Stereo／Exp</text>
<text x="550" y="130" font-size="10" fill="#475569">削二式 Interleave／Seperate</text>
<text x="550" y="148" font-size="10" fill="#475569">clip 查表・DMA 雙頁</text>
<text x="550" y="166" font-size="10" fill="#475569">.386 平坦・tasm・REPT 展開</text>
<text x="550" y="186" font-size="10" fill="#475569">qsound 單流未進（虛線見下）</text>
<rect x="430" y="216" width="240" height="114" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="550" y="238" font-size="11">SFX 四格式＋MUS</text>
<text x="550" y="258" font-size="10" fill="#475569">FMT enum 0-3・首字路由</text>
<text x="550" y="276" font-size="10" fill="#475569">PCS／GSS_W／GSS_P／WAV 欄</text>
<text x="550" y="294" font-size="10" fill="#475569">MUS 檔頭 MUS\x1A・事件流</text>
<text x="550" y="312" font-size="10" fill="#475569">*.dsp・LoadPatch 直讀</text>
<rect x="430" y="346" width="240" height="130" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="550" y="368" font-size="11">fmfix・工具鏈</text>
<text x="550" y="388" font-size="10" fill="#475569">fmfix：偵測嚴・搶聲簡</text>
<text x="550" y="406" font-size="10" fill="#475569">56 行・非單向升級</text>
<text x="550" y="428" font-size="10" fill="#475569">wcc386p＋tasm＋wlib</text>
<text x="550" y="446" font-size="10" fill="#475569">DOS4GW・-4r・-zp1</text>
<path d="M 390,360 L 430,180" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="408" y="280" font-size="9" fill="#475569">取樣</text>
<!-- bottom: ship vs spare -->
<rect x="30" y="492" width="360" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="210" y="514" font-size="11">出貨 20 件（dmx.mif）</text>
<text x="210" y="534" font-size="10" fill="#475569">核心 10・驅動 6・底層 4・test 連上層庫</text>
<rect x="410" y="492" width="260" height="64" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="540" y="514" font-size="11" fill="#475569">備份 5 件未進</text>
<text x="540" y="534" font-size="10" fill="#94a3b8">fm3812・codec・qsound</text>
<text x="540" y="548" font-size="10" fill="#94a3b8">pcint・hpmixers</text>
