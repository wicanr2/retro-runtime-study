<svg xmlns="http://www.w3.org/2000/svg" width="700" height="570" viewBox="0 0 700 570" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
<rect x="0" y="0" width="700" height="570" fill="#ffffff"/>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
</marker>
</defs>
<g font-size="13" fill="#0f172a" text-anchor="middle">
<text x="350" y="24">DMX 裝置與格式：七驅動填兩張表，取樣經混音管線，格式首字路由</text>
<text x="350" y="40" font-size="11" fill="#475569">實線＝出貨（dmx.mif 20 件）・虛線框＝備份未進／無表・橘框＝驅動契約表・箭頭＝填表／資料流</text>
<!-- drivers -->
<rect x="30" y="52" width="180" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="120" y="73" font-size="11">FM・FmMus</text>
<text x="120" y="90" font-size="10" fill="#475569">fmopl2・OPL2/3・9→18 聲</text>
<rect x="30" y="114" width="180" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="120" y="135" font-size="11">MPU・MpuMus</text>
<text x="120" y="152" font-size="10" fill="#475569">mpu401・UART 直寫</text>
<rect x="30" y="176" width="180" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="120" y="197" font-size="11">AWE・AweMus</text>
<text x="120" y="214" font-size="10" fill="#475569">awe32・二進位牆</text>
<rect x="30" y="238" width="180" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="120" y="259" font-size="11">GUS・Gf1 雙表</text>
<text x="120" y="276" font-size="10" fill="#475569">gravis・4196 行・DMXGUS</text>
<rect x="30" y="300" width="180" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="120" y="321" font-size="11">SB・clWav</text>
<text x="120" y="338" font-size="10" fill="#475569">clabs・DMA 雙頁</text>
<rect x="30" y="362" width="180" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
