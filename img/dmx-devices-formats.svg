<text x="120" y="400" font-size="10" fill="#475569">pas・DMA 雙頁</text>
<rect x="30" y="424" width="180" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="120" y="445" font-size="11">PCS 喇叭</text>
<text x="120" y="462" font-size="10" fill="#475569">pcsapi・無表直調</text>
