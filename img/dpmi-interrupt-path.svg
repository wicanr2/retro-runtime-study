<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="940" height="700" fill="#ffffff"/>

  <defs>
    <marker id="p1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a94a6"/>
    </marker>
    <marker id="p2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="26" y="32" font-size="15" font-weight="bold" fill="#1f2933">音效卡的中斷不管你在哪個模式</text>

  <!-- 上：記憶體版面 -->
  <rect x="26" y="52" width="430" height="300" rx="8" fill="#fbfcfd" stroke="#d0d5dd"/>
  <text x="42" y="76" font-size="13" font-weight="bold" fill="#1f2933">記憶體：兩條硬限制</text>

  <rect x="42" y="92" width="398" height="86" rx="6" fill="#eef4fb" stroke="#b9cfe6"/>
  <text x="58" y="114" font-size="12" font-weight="bold" fill="#1f2933">1 MB 以上　程式本體與資料</text>
  <text x="58" y="136" font-size="11.5" fill="#5a6472">32 位元、保護模式、可能被換到磁碟</text>
  <text x="58" y="158" font-size="11.5" fill="#8a2b2b">DMA 控制器碰不到這裡（只有 24 條位址線）</text>

  <path d="M240,178 L240,196" stroke="#d97706" fill="none" marker-end="url(#p2)"/>
  <text x="252" y="192" font-size="11" fill="#8a4b00">所以要另外配一塊</text>

  <rect x="42" y="200" width="398" height="96" rx="6" fill="#fff8f0" stroke="#d97706"/>
  <text x="58" y="222" font-size="12" font-weight="bold" fill="#8a4b00">1 MB 以下　DMA 緩衝 ＋ 那段 16 位元中斷碼</text>
  <text x="58" y="244" font-size="11.5" fill="#5a6472">用 DPMI 向 extender 要，而且要鎖住不被換出</text>
  <text x="58" y="266" font-size="11.5" fill="#5a6472">16 位元的處理常式從程式裡複製過來，</text>
  <text x="58" y="284" font-size="11.5" fill="#5a6472">複製後就地修正絕對位址</text>

  <text x="42" y="322" font-size="11.5" fill="#1f2933">程式裡那個 USE16 的段不是遺留的舊碼，</text>
  <text x="42" y="342" font-size="11.5" fill="#1f2933">是刻意留著要搬下去的一塊。</text>

  <!-- 右：中斷路徑 -->
  <rect x="472" y="52" width="442" height="300" rx="8" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="488" y="76" font-size="13" font-weight="bold" fill="#1f2933">IRQ 來的時候，處理器可能在任一邊</text>

  <rect x="488" y="92" width="410" height="52" rx="6" fill="#f4f6f8" stroke="#dfe3e8"/>
  <text x="504" y="114" font-size="11.5" fill="#1f2933">程式呼叫 DOS 讀檔 → extender 切回實模式</text>
  <text x="504" y="134" font-size="11.5" fill="#5a6472">這段時間裡，保護模式的處理常式接不到中斷</text>

  <path d="M693,144 L693,162" stroke="#8a94a6" fill="none" marker-end="url(#p1)"/>

  <rect x="488" y="166" width="410" height="74" rx="6" fill="#fff8f0" stroke="#d97706"/>
  <text x="504" y="188" font-size="12" font-weight="bold" fill="#8a4b00">解法：準備一份真實模式的處理常式</text>
  <text x="504" y="210" font-size="11.5" fill="#5a6472">用 DPMI 取得／設定實模式的中斷向量，</text>
  <text x="504" y="230" font-size="11.5" fill="#5a6472">指到複製下去的那段 16 位元碼</text>

  <path d="M693,240 L693,258" stroke="#8a94a6" fill="none" marker-end="url(#p1)"/>

  <rect x="488" y="262" width="410" height="74" rx="6" fill="#eef4fb" stroke="#b9cfe6"/>
  <text x="504" y="284" font-size="12" font-weight="bold" fill="#1f2933">收尾三件事（少一件就留下不穩定的系統）</text>
  <text x="504" y="306" font-size="11.5" fill="#5a6472">還低位記憶體、解鎖、還原中斷向量</text>
  <text x="504" y="326" font-size="11.5" fill="#5a6472">DMX 的介面裡每一項都有對應的函式</text>

  <!-- 下：三個階段 -->
  <rect x="26" y="368" width="888" height="196" rx="8" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="42" y="392" font-size="13" font-weight="bold" fill="#1f2933">DPMI 終結了 extender 各自為政</text>

  <rect x="42" y="406" width="276" height="140" rx="6" fill="#fdecec" stroke="#d98080"/>
  <text x="58" y="428" font-size="12.5" font-weight="bold" fill="#8a2b2b">1989　Watcom 7.0</text>
  <text x="58" y="452" font-size="11.5" fill="#1f2933">extender 自己去買</text>
  <text x="58" y="474" font-size="11.5" fill="#1f2933">編譯器只支援兩家</text>
  <text x="58" y="498" font-size="11.5" fill="#5a6472">各家私有介面；連 PSP 的選擇器</text>
  <text x="58" y="516" font-size="11.5" fill="#5a6472">都寫死在啟動碼裡，條件編譯二選一</text>
  <text x="58" y="538" font-size="11" fill="#8a2b2b">換一家就要重編一個版本</text>

  <rect x="332" y="406" width="276" height="140" rx="6" fill="#fff8f0" stroke="#d97706"/>
  <text x="348" y="428" font-size="12.5" font-weight="bold" fill="#8a4b00">1992　Watcom 9.01</text>
  <text x="348" y="452" font-size="11.5" fill="#1f2933">DOS/4GW 隨編譯器附</text>
  <text x="348" y="474" font-size="11.5" fill="#5a6472">（Rational 的產品，221 KB，</text>
  <text x="348" y="492" font-size="11.5" fill="#5a6472">裝在編譯器的 bin 目錄）</text>
  <text x="348" y="516" font-size="11.5" fill="#1f2933">另外支援 Phar Lap 與 Ergo</text>
  <text x="348" y="538" font-size="11" fill="#8a4b00">改走 DPMI：int 31h 一套通吃</text>

  <rect x="622" y="406" width="292" height="140" rx="6" fill="#eef4fb" stroke="#b9cfe6"/>
  <text x="638" y="428" font-size="12.5" font-weight="bold" fill="#1f2933">1993–94　DMX 與那批遊戲</text>
  <text x="638" y="452" font-size="11.5" fill="#1f2933">直接綁 DOS/4GW</text>
  <text x="638" y="474" font-size="11.5" fill="#5a6472">音效卡的中斷、DMA 緩衝、</text>
  <text x="638" y="492" font-size="11.5" fill="#5a6472">記憶體鎖定全走 DPMI</text>
  <text x="638" y="516" font-size="11.5" fill="#1f2933">市場收斂到同一套執行環境</text>
  <text x="638" y="538" font-size="11" fill="#5a6472">所以那個年代的遊戲開頭都是同一行字</text>

  <!-- 底：證據強度 -->
  <rect x="26" y="580" width="888" height="98" rx="8" fill="#f4f6f8" stroke="#d0d5dd"/>
  <text x="42" y="604" font-size="12.5" fill="#1f2933">這張圖的證據不平均：DPMI 那一側有完整的原始碼可讀（DMX），9.01 那一側只有安裝腳本與封包清單。</text>
  <text x="42" y="628" font-size="12.5" fill="#1f2933">9.01 磁片上的檔案用 Watcom 自己的壓縮封裝，解碼器還沒寫完——本體、stub 與啟動碼都還沒讀到。</text>
  <text x="42" y="656" font-size="12" fill="#8a2b2b">本圖只根據原廠安裝腳本、封包檔頭與 DMX 的原始碼；不貼原文，不做位元組簽章。</text>
</svg>
