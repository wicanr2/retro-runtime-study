<svg xmlns="http://www.w3.org/2000/svg" width="920" height="676" viewBox="0 0 920 676" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="920" height="676" fill="#ffffff"/>

  <defs>
    <marker id="h1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a94a6"/>
    </marker>
    <marker id="h2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="26" y="32" font-size="15" font-weight="bold" fill="#1f2933">同一份設計，兩套尺寸</text>

  <!-- near heap -->
  <rect x="26" y="50" width="420" height="284" rx="10" fill="#fbfcfd" stroke="#d0d5dd"/>
  <text x="44" y="76" font-size="13.5" font-weight="bold" fill="#1f2933">near heap（small、medium）</text>
  <text x="44" y="96" font-size="12" fill="#5a6472">單位是 byte，住在 DS 的 64 KB 裡</text>

  <text x="44" y="126" font-size="12.5" fill="#1f2933">已配置區塊：頭 4 bytes</text>
  <g>
    <rect x="44" y="136" width="96" height="40" rx="4" fill="#fff8f0" stroke="#d97706"/>
    <text x="92" y="153" text-anchor="middle" font-size="12" fill="#1f2933">大小</text>
    <text x="92" y="169" text-anchor="middle" font-size="11" fill="#8a4b00">＋1＝在用中</text>
    <rect x="140" y="136" width="96" height="40" rx="4" fill="#ffffff" stroke="#dfe3e8"/>
    <text x="188" y="160" text-anchor="middle" font-size="12" fill="#1f2933">實體前一塊</text>
    <rect x="236" y="136" width="186" height="40" rx="4" fill="#f4f6f8" stroke="#dfe3e8" stroke-dasharray="4 3"/>
    <text x="329" y="160" text-anchor="middle" font-size="12" fill="#5a6472">使用者拿到的資料區</text>
  </g>

  <text x="44" y="206" font-size="12.5" fill="#1f2933">free 區塊：頭 8 bytes（所以最小區塊就是 8）</text>
  <g>
    <rect x="44" y="216" width="94" height="40" rx="4" fill="#fff8f0" stroke="#d97706"/>
    <text x="91" y="240" text-anchor="middle" font-size="12" fill="#1f2933">大小（偶數）</text>
    <rect x="138" y="216" width="94" height="40" rx="4" fill="#ffffff" stroke="#dfe3e8"/>
    <text x="185" y="240" text-anchor="middle" font-size="12" fill="#1f2933">實體前一塊</text>
    <rect x="232" y="216" width="94" height="40" rx="4" fill="#eef4fb" stroke="#b9cfe6"/>
    <text x="279" y="240" text-anchor="middle" font-size="12" fill="#1f2933">佇列前一塊</text>
    <rect x="326" y="216" width="96" height="40" rx="4" fill="#eef4fb" stroke="#b9cfe6"/>
    <text x="374" y="240" text-anchor="middle" font-size="12" fill="#1f2933">佇列下一塊</text>
  </g>

  <text x="44" y="288" font-size="12" fill="#5a6472">大小永遠是偶數，最低位元空著，</text>
  <text x="44" y="306" font-size="12" fill="#5a6472">配置器就拿它當「在用中」的旗標。</text>
  <text x="44" y="324" font-size="12" fill="#5a6472">管理變數放在 DS 的資料段。</text>

  <!-- far heap -->
  <rect x="470" y="50" width="424" height="284" rx="10" fill="#fbfcfd" stroke="#d0d5dd"/>
  <text x="488" y="76" font-size="13.5" font-weight="bold" fill="#1f2933">far heap（compact、large、huge）</text>
  <text x="488" y="96" font-size="12" fill="#5a6472">單位是段落（16 bytes），住在程式那塊 DOS 記憶體的尾端</text>

  <text x="488" y="126" font-size="12.5" fill="#1f2933">已配置區塊：頭 4 bytes</text>
  <g>
    <rect x="488" y="136" width="96" height="40" rx="4" fill="#fff8f0" stroke="#d97706"/>
    <text x="536" y="160" text-anchor="middle" font-size="12" fill="#1f2933">大小（段落數）</text>
    <rect x="584" y="136" width="120" height="40" rx="4" fill="#ffffff" stroke="#dfe3e8"/>
    <text x="644" y="153" text-anchor="middle" font-size="12" fill="#1f2933">實體前一塊</text>
    <text x="644" y="169" text-anchor="middle" font-size="11" fill="#8a4b00">不為 0＝在用中</text>
    <rect x="704" y="136" width="176" height="40" rx="4" fill="#f4f6f8" stroke="#dfe3e8" stroke-dasharray="4 3"/>
    <text x="792" y="160" text-anchor="middle" font-size="12" fill="#5a6472">使用者拿到的資料區</text>
  </g>

  <text x="488" y="206" font-size="12.5" fill="#1f2933">free 區塊：頭 10 bytes（最小區塊 16 bytes＝一個段落）</text>
  <g>
    <rect x="488" y="216" width="76" height="40" rx="4" fill="#fff8f0" stroke="#d97706"/>
    <text x="526" y="240" text-anchor="middle" font-size="11.5" fill="#1f2933">大小</text>
    <rect x="564" y="216" width="80" height="40" rx="4" fill="#ffffff" stroke="#dfe3e8"/>
    <text x="604" y="234" text-anchor="middle" font-size="11.5" fill="#8a4b00">0</text>
    <text x="604" y="250" text-anchor="middle" font-size="10.5" fill="#5a6472">（代表 free）</text>
    <rect x="644" y="216" width="76" height="40" rx="4" fill="#eef4fb" stroke="#b9cfe6"/>
    <text x="682" y="240" text-anchor="middle" font-size="11.5" fill="#1f2933">佇列前一塊</text>
    <rect x="720" y="216" width="76" height="40" rx="4" fill="#eef4fb" stroke="#b9cfe6"/>
    <text x="758" y="240" text-anchor="middle" font-size="11.5" fill="#1f2933">佇列下一塊</text>
    <rect x="796" y="216" width="84" height="40" rx="4" fill="#ffffff" stroke="#dfe3e8"/>
    <text x="838" y="240" text-anchor="middle" font-size="11.5" fill="#1f2933">實體前一塊</text>
  </g>

  <text x="488" y="288" font-size="12" fill="#5a6472">大小是段落數，沒有空位元可借，</text>
  <text x="488" y="306" font-size="12" fill="#5a6472">於是改用「實體前一塊＝0」當旗標，真正的值搬到最後一欄。</text>
  <text x="488" y="324" font-size="12" fill="#5a6472">管理變數放在程式碼段，省下切換 DS。</text>

  <!-- free 佇列 -->
  <rect x="26" y="352" width="868" height="236" rx="10" fill="#fbfcfd" stroke="#d0d5dd"/>
  <text x="44" y="378" font-size="13.5" font-weight="bold" fill="#1f2933">free 佇列：雙向環狀，順序與實體位置無關</text>

  <g font-size="12" fill="#1f2933">
    <rect x="56" y="414" width="110" height="46" rx="6" fill="#ffffff" stroke="#dfe3e8"/>
    <text x="111" y="442" text-anchor="middle">在用中</text>
    <rect x="176" y="414" width="110" height="46" rx="6" fill="#eef4fb" stroke="#b9cfe6"/>
    <text x="231" y="442" text-anchor="middle">free A</text>
    <rect x="296" y="414" width="150" height="46" rx="6" fill="#ffffff" stroke="#dfe3e8"/>
    <text x="371" y="442" text-anchor="middle">在用中</text>
    <rect x="456" y="414" width="110" height="46" rx="6" fill="#eef4fb" stroke="#b9cfe6"/>
    <text x="511" y="442" text-anchor="middle">free B</text>
    <rect x="576" y="414" width="130" height="46" rx="6" fill="#ffffff" stroke="#dfe3e8"/>
    <text x="641" y="442" text-anchor="middle">在用中</text>
    <rect x="716" y="414" width="146" height="46" rx="6" fill="#eef4fb" stroke="#b9cfe6"/>
    <text x="789" y="442" text-anchor="middle">free C</text>
  </g>
  <text x="56" y="408" font-size="11.5" fill="#5a6472">實體順序（heap 由低到高）</text>

  <path d="M237,468 C 300,508 440,508 505,468" stroke="#b9cfe6" fill="none" marker-start="url(#h1)" marker-end="url(#h1)"/>
  <path d="M517,468 C 590,512 720,512 783,468" stroke="#b9cfe6" fill="none" marker-start="url(#h1)" marker-end="url(#h1)"/>
  <path d="M795,468 C 700,546 320,546 231,468" stroke="#b9cfe6" fill="none" marker-start="url(#h1)" marker-end="url(#h1)"/>

  <path d="M511,396 L511,412" stroke="#d97706" fill="none" marker-end="url(#h2)"/>
  <text x="455" y="408" font-size="11.5" fill="#8a4b00">漫遊指標</text>

  <text x="56" y="552" font-size="12" fill="#5a6472">malloc 從漫遊指標指的那塊開始沿佇列繞一圈，第一個裝得下的就用。漫遊指標只是佇列的把手——切割配置不會移動它。</text>
  <text x="56" y="572" font-size="12" fill="#5a6472">這裡把佇列畫成與實體順序一致只是為了看得清楚——佇列本身不保證如此，配置與釋放的順序決定它長什麼樣。</text>

  <rect x="26" y="602" width="868" height="56" rx="8" fill="#f4f6f8" stroke="#d0d5dd"/>
  <text x="42" y="626" font-size="12.5" fill="#1f2933">切割從空洞的尾端切：留在佇列裡的是前半段，位址沒變，前後指標都不用改。</text>
  <text x="42" y="646" font-size="12.5" fill="#1f2933">near heap 在多出來的空間放不下一個 free 區塊頭時就不切，整塊給出去（內部碎片）；far heap 多一個段落就切。</text>
</svg>
