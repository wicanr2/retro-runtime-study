<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
  <rect width="900" height="470" fill="#ffffff"/>
  <style>
    text { font-family: 'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif; fill: #222; }
    .title { font-size: 15px; font-weight: bold; }
    .box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1; rx: 6; }
    .src { fill: #fff4ea; stroke: #d97706; stroke-width: 1; }
    .warn { fill: #fef2f2; stroke: #dc2626; stroke-width: 1; }
    .small { font-size: 11px; fill: #666; }
    .label { font-size: 13px; fill: #222; }
    .mono { font-family: ui-monospace,Consolas,monospace; }
  </style>

  <!-- 標題 -->
  <text x="30" y="30" class="title">rand：一個 32 位元 LCG</text>
  <text x="470" y="30" class="title">time 家族：日期與時刻都問 DOS</text>
  <line x1="450" y1="14" x2="450" y2="455" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ================= 左：LCG ================= -->
  <rect x="40" y="50" width="360" height="54" rx="6" class="box"/>
  <text x="220" y="72" text-anchor="middle" class="label">狀態 Seed：32 位元 long（初始值 1）</text>
  <text x="220" y="92" text-anchor="middle" class="small">srand(s) 就是 Seed ＝ s；同一種子永遠同一串</text>

  <path d="M 60 104 L 60 132" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 380 132 L 380 104" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
    <marker id="arrw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="220" y="126" text-anchor="middle" class="label mono">Seed ＝ Seed × 0x015A4E35 ＋ 1  (mod 2³²)</text>

  <!-- 位元抽取 -->
  <rect x="60" y="150" width="200" height="30" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="160" y="170" text-anchor="middle" class="label mono">捨棄：第 0–15 位元</text>
  <rect x="270" y="150" width="130" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="335" y="170" text-anchor="middle" class="label mono">取：第 16–30 位元</text>
  <text x="220" y="200" text-anchor="middle" class="small">rand() ＝ (Seed ≫ 16) &amp; 0x7FFF　→　0…32767（RAND_MAX）</text>

  <path d="M 220 206 L 220 228" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="60" y="232" width="320" height="76" rx="6" class="box"/>
  <text x="220" y="254" text-anchor="middle" class="label">random(n) ＝ (long)rand() × n ÷ 32768</text>
  <text x="220" y="274" text-anchor="middle" class="label">randomize() ＝ srand((unsigned)time(NULL))</text>
  <text x="220" y="296" text-anchor="middle" class="small">兩個都是巨集：呼叫端展開，函式庫裡沒有這兩個符號</text>

  <rect x="60" y="326" width="320" height="112" rx="6" class="box"/>
  <text x="80" y="350" class="label">參考序列（種子 1 ＝ 不設種子）：</text>
  <text x="80" y="372" class="label mono">346, 130, 10982, 1090, 11656, 7117…</text>
  <text x="80" y="396" class="small">種子 0：0 之後與種子 1 同步（0×乘數＋1＝1）</text>
  <text x="80" y="416" class="small">乘數 ≡1 (mod 4)、增量為奇數 → 滿週期 2³²</text>

  <!-- ================= 右：時間鏈 ================= -->
  <!-- 來源 -->
  <rect x="480" y="50" width="110" height="54" rx="6" class="src"/>
  <text x="535" y="72" text-anchor="middle" class="label mono">int 1Ah</text>
  <text x="535" y="92" text-anchor="middle" class="small">BIOS tick（18.2/秒）</text>
  <rect x="606" y="50" width="110" height="54" rx="6" class="src"/>
  <text x="661" y="72" text-anchor="middle" class="label mono">AH=2Ah</text>
  <text x="661" y="92" text-anchor="middle" class="small">DOS 日期</text>
  <rect x="732" y="50" width="110" height="54" rx="6" class="src"/>
  <text x="787" y="72" text-anchor="middle" class="label mono">AH=2Ch</text>
  <text x="787" y="92" text-anchor="middle" class="small">DOS 時刻（1/100 秒）</text>
  <text x="490" y="124" class="small">來源就這三個；時區資訊 DOS 不提供 →</text>
  <text x="490" y="141" class="small">tzset 只讀 TZ 環境變數（3 字母＋整數小時）</text>

  <!-- 換算層 -->
  <rect x="480" y="156" width="170" height="58" rx="6" class="box"/>
  <text x="565" y="178" text-anchor="middle" class="label">clock()</text>
  <text x="565" y="198" text-anchor="middle" class="small">tick − _StartTime（C0 開機取樣）</text>

  <rect x="672" y="156" width="170" height="58" rx="6" class="box"/>
  <text x="757" y="178" text-anchor="middle" class="label">time() ＝ dostounix()</text>
  <text x="757" y="198" text-anchor="middle" class="small">以 1980 為基準做 4 年塊換算</text>

  <path d="M 535 104 L 535 152" stroke="#d97706" stroke-width="1.2" marker-end="url(#arro)"/>
  <path d="M 700 104 L 740 152" stroke="#d97706" stroke-width="1.2" marker-end="url(#arro)"/>
  <path d="M 787 104 L 780 152" stroke="#d97706" stroke-width="1.2" marker-end="url(#arro)"/>

  <!-- TZ -->
  <rect x="480" y="230" width="170" height="58" rx="6" class="box"/>
  <text x="565" y="252" text-anchor="middle" class="label">timezone / daylight</text>
  <text x="565" y="272" text-anchor="middle" class="small">localtime(t) ＝ t − timezone</text>

  <!-- 轉換層 -->
  <rect x="672" y="230" width="170" height="58" rx="6" class="box"/>
  <text x="757" y="252" text-anchor="middle" class="label">comtime（1970 基準）</text>
  <text x="757" y="272" text-anchor="middle" class="small">gmtime／localtime／mktime</text>

  <path d="M 565 214 L 565 226" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 757 214 L 757 226" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- DST -->
  <rect x="480" y="306" width="362" height="64" rx="6" class="box"/>
  <text x="661" y="328" text-anchor="middle" class="label">__isDST：寫死的美國規則（4–10 月）</text>
  <text x="661" y="348" text-anchor="middle" class="small">1987 年起＝4 月第一個星期日 2:00；1986 年及以前＝最後一個星期日</text>
  <text x="661" y="364" text-anchor="middle" class="small">10 月一律最後一個星期日 1:00 止；閏年一律 year &amp; 3（到 2099 都對）</text>

  <!-- 警告 -->
  <rect x="480" y="388" width="362" height="50" rx="6" class="warn"/>
  <text x="661" y="408" text-anchor="middle" class="label">⚠ mktime 對閏年 2 月 29 無限迴圈</text>
  <text x="661" y="428" text-anchor="middle" class="small">正規化迴圈條件用非閏年表，day==28 時不動狀態；五個模型都重現</text>
</svg>
