<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <rect width="900" height="480" fill="#ffffff"/>
  <style>
    text { font-family: 'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif; fill: #222; }
    .title { font-size: 15px; font-weight: bold; }
    .box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1; }
    .cls { fill: #eef4fb; stroke: #4b7bb5; stroke-width: 1; }
    .src { fill: #fff4ea; stroke: #d97706; stroke-width: 1; }
    .warn { fill: #fef2f2; stroke: #dc2626; stroke-width: 1; }
    .small { font-size: 11px; fill: #666; }
    .label { font-size: 13px; }
    .mono { font-family: ui-monospace,Consolas,monospace; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="30" y="28" class="title">類別地圖（iostream.h／fstream.h）</text>
  <text x="470" y="28" class="title">預設串流與兩套緩衝</text>
  <line x1="450" y1="12" x2="450" y2="465" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 左：類別階層 -->
  <rect x="40" y="46" width="180" height="46" rx="6" class="cls"/>
  <text x="130" y="65" text-anchor="middle" class="label mono">ios（虛擬基礎）</text>
  <text x="130" y="83" text-anchor="middle" class="small">狀態、旗標、precision/fill/tie</text>

  <rect x="40" y="120" width="180" height="46" rx="6" class="cls"/>
  <text x="130" y="139" text-anchor="middle" class="label mono">streambuf</text>
  <text x="130" y="157" text-anchor="middle" class="small">get/put 區、overflow/underflow</text>

  <rect x="30" y="200" width="95" height="40" rx="6" class="cls"/>
  <text x="77" y="224" text-anchor="middle" class="label mono">istream</text>
  <rect x="145" y="200" width="95" height="40" rx="6" class="cls"/>
  <text x="192" y="224" text-anchor="middle" class="label mono">ostream</text>
  <path d="M 77 196 L 105 96" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M 192 196 L 150 96" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <rect x="85" y="262" width="110" height="36" rx="6" class="cls"/>
  <text x="140" y="285" text-anchor="middle" class="label mono">iostream</text>
  <path d="M 77 244 L 110 258" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M 192 244 L 165 258" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="40" y="322" width="200" height="46" rx="6" class="cls"/>
  <text x="140" y="341" text-anchor="middle" class="label mono">*_withassign（cin/cout…）</text>
  <text x="140" y="359" text-anchor="middle" class="small">operator= 可換 streambuf</text>
  <path d="M 140 302 L 140 318" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="270" y="120" width="150" height="46" rx="6" class="cls"/>
  <text x="345" y="139" text-anchor="middle" class="label mono">filebuf（fstream.h）</text>
  <text x="345" y="157" text-anchor="middle" class="small">低階 handle、[4B 回看][寫區]</text>
  <path d="M 270 143 L 224 143" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="270" y="200" width="150" height="46" rx="6" class="box"/>
  <text x="345" y="219" text-anchor="middle" class="label mono">fstream／ifstream／ofstream</text>
  <text x="345" y="237" text-anchor="middle" class="small">fstreambase ＋ stream</text>

  <rect x="270" y="272" width="150" height="46" rx="6" class="box"/>
  <text x="345" y="291" text-anchor="middle" class="label mono">stdiobuf／stdiostream</text>
  <text x="345" y="309" text-anchor="middle" class="small">包 stdio 的 FILE*</text>

  <rect x="40" y="392" width="380" height="64" rx="6" class="box"/>
  <text x="230" y="414" text-anchor="middle" class="label">STREAM.H 的舊式 stream 是另一族</text>
  <text x="230" y="434" text-anchor="middle" class="small">8 個核心模組獨立成 oldstrm&lt;模型&gt;.lib；格式化直接走 sprintf</text>
  <text x="230" y="450" text-anchor="middle" class="small">要自己多連一個庫；新式的 191 個模組在主庫裡</text>

  <!-- 右：資料流 -->
  <rect x="480" y="46" width="180" height="54" rx="6" class="src"/>
  <text x="570" y="66" text-anchor="middle" class="label mono">Iostream_init</text>
  <text x="570" y="84" text-anchor="middle" class="small">啟動優先序 16：建三個 filebuf</text>

  <rect x="480" y="118" width="180" height="54" rx="6" class="src"/>
  <text x="570" y="138" text-anchor="middle" class="label">使用者全域建構</text>
  <text x="570" y="156" text-anchor="middle" class="small">優先序 32：cout 已可用</text>

  <path d="M 570 100 L 570 114" stroke="#d97706" stroke-width="1.2" marker-end="url(#arro)"/>

  <rect x="680" y="46" width="180" height="54" rx="6" class="box"/>
  <text x="770" y="66" text-anchor="middle" class="label mono">filebuf（1024B）</text>
  <text x="770" y="84" text-anchor="middle" class="small">自己的緩衝，與 stdio 不通</text>
  <path d="M 660 73 L 676 73" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="680" y="118" width="180" height="54" rx="6" class="box"/>
  <text x="770" y="138" text-anchor="middle" class="label">tie：cin → cout</text>
  <text x="770" y="156" text-anchor="middle" class="small">輸入前先刷輸出（ipfx）</text>
  <path d="M 660 145 L 676 145" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="480" y="196" width="380" height="88" rx="6" class="box"/>
  <text x="670" y="218" text-anchor="middle" class="label"><< ＝ opfx（刷 tie）→ 轉換 → outstr 墊墊 → osfx</text>
  <text x="670" y="240" text-anchor="middle" class="small">width 一次性；left/right/internal；fill</text>
  <text x="670" y="260" text-anchor="middle" class="small">整數：自有 todec/tooct/tohex；浮點：自有 AT&T cvt</text>
  <text x="670" y="278" text-anchor="middle" class="small">（precision≤0 視為 6；0.0001 預設會印成 0）</text>

  <rect x="480" y="302" width="380" height="72" rx="6" class="box"/>
  <text x="670" y="324" text-anchor="middle" class="label">sync_with_stdio（一次性）</text>
  <text x="670" y="344" text-anchor="middle" class="small">cin/cout/clog 換成 stdiobuf（包 FILE*）；</text>
  <text x="670" y="362" text-anchor="middle" class="small">之後 cout/clog 永遠 unitbuf；實測會踩空指標哨兵</text>

  <rect x="480" y="392" width="380" height="64" rx="6" class="warn"/>
  <text x="670" y="414" text-anchor="middle" class="label">cerr：unitbuf 永遠開（每筆即刷）</text>
  <text x="670" y="434" text-anchor="middle" class="small">cout：isatty(1) 為真才 unitbuf（主控台即刷、轉向檔案全緩衝；</text>
  <text x="670" y="450" text-anchor="middle" class="small">實測環境的 handle 1 回報檔案 → 觀察到 isatty=0）</text>
</svg>
