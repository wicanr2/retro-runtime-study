<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="920" height="620" fill="#ffffff"/>

  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a94a6"/>
    </marker>
    <marker id="d2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="26" y="32" font-size="15" font-weight="bold" fill="#1f2933">把會變的東西關在最外圈</text>

  <!-- 三種語言的介面 -->
  <rect x="26" y="52" width="290" height="116" rx="10" fill="#eef4fb" stroke="#b9cfe6"/>
  <text x="44" y="76" font-size="13" font-weight="bold" fill="#1f2933">三種語言，一份實作</text>
  <g font-size="12" fill="#1f2933">
    <rect x="44" y="88" width="80" height="30" rx="5" fill="#ffffff" stroke="#b9cfe6"/>
    <text x="84" y="108" text-anchor="middle">.H（C）</text>
    <rect x="132" y="88" width="88" height="30" rx="5" fill="#ffffff" stroke="#b9cfe6"/>
    <text x="176" y="108" text-anchor="middle">.PAS（Pascal）</text>
    <rect x="228" y="88" width="72" height="30" rx="5" fill="#ffffff" stroke="#b9cfe6"/>
    <text x="264" y="108" text-anchor="middle">.INC（組語）</text>
  </g>
  <text x="44" y="138" font-size="11.5" fill="#5a6472">同一批型別與函式宣告的三種寫法；</text>
  <text x="44" y="156" font-size="11.5" fill="#5a6472">Pascal 那份的檔頭寫明譯自 C 標頭。</text>

  <path d="M171,168 L171,196" stroke="#d97706" fill="none" marker-end="url(#d2)"/>
  <text x="180" y="188" font-size="11.5" fill="#8a4b00">都指向同一份目的碼</text>

  <!-- 五層 -->
  <rect x="26" y="204" width="560" height="298" rx="10" fill="#fbfcfd" stroke="#d0d5dd"/>
  <text x="44" y="228" font-size="13" font-weight="bold" fill="#1f2933">五層架構</text>

  <rect x="44" y="240" width="524" height="46" rx="6" fill="#fff8f0" stroke="#d97706"/>
  <text x="58" y="260" font-size="12.5" fill="#1f2933">播放核心　MCP（多聲道播放）、AMP（模組音樂）</text>
  <text x="58" y="277" font-size="11.5" fill="#5a6472">只認內部的 AMF 格式</text>

  <path d="M306,286 L306,300" stroke="#8a94a6" fill="none" marker-end="url(#d1)"/>

  <rect x="44" y="304" width="524" height="38" rx="6" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="58" y="328" font-size="12.5" fill="#1f2933">聲道分配　CDI　誰拿到哪個聲道；音效與音樂搶資源時的仲裁</text>

  <path d="M306,342 L306,356" stroke="#8a94a6" fill="none" marker-end="url(#d1)"/>

  <rect x="44" y="360" width="524" height="62" rx="6" fill="#fff8f0" stroke="#d97706"/>
  <text x="58" y="380" font-size="12.5" fill="#1f2933">裝置介面　SDI_*　每張卡一份</text>
  <text x="58" y="399" font-size="11.5" fill="#5a6472">SB、SB16、Pro Audio Spectrum、Windows Sound System、DAC、ARIA，</text>
  <text x="58" y="415" font-size="11.5" fill="#5a6472">還有一個「寫到磁碟」的版本——除錯用，能塞進同一個介面就是切得夠乾淨的證據</text>

  <rect x="44" y="430" width="256" height="30" rx="6" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="58" y="450" font-size="12.5" fill="#1f2933">硬體偵測　DET*　每張卡一支</text>

  <rect x="312" y="430" width="256" height="30" rx="6" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="326" y="450" font-size="12.5" fill="#1f2933">服務　計時、混音器、虛擬 DMA、記憶體</text>

  <text x="44" y="482" font-size="12" fill="#5a6472">換一張音效卡只換裝置介面那一層，上面三層看到的是同一組抽象。</text>

  <!-- 載入器 -->
  <rect x="602" y="204" width="292" height="150" rx="10" fill="#fbfcfd" stroke="#d0d5dd"/>
  <text x="620" y="228" font-size="13" font-weight="bold" fill="#1f2933">載入器：一種格式一支</text>
  <text x="620" y="252" font-size="12" fill="#1f2933">MOD、S3M、STM、669、MTM、</text>
  <text x="620" y="270" font-size="12" fill="#1f2933">FAR、ULT、OCT⋯⋯</text>
  <path d="M700,282 L700,300" stroke="#d97706" fill="none" marker-end="url(#d2)"/>
  <rect x="620" y="304" width="256" height="34" rx="6" fill="#fff8f0" stroke="#d97706"/>
  <text x="634" y="326" font-size="12.5" fill="#1f2933">一律轉成內部的 AMF 格式</text>

  <!-- GUS -->
  <rect x="602" y="366" width="292" height="136" rx="10" fill="#fdecec" stroke="#d98080"/>
  <text x="620" y="390" font-size="13" font-weight="bold" fill="#8a2b2b">GUS 是特例</text>
  <text x="620" y="412" font-size="12" fill="#1f2933">其他卡：主機混好一條音訊流餵過去</text>
  <text x="620" y="432" font-size="12" fill="#1f2933">GUS：樣本先上傳到卡上，卡自己混音</text>
  <text x="620" y="458" font-size="11.5" fill="#5a6472">所以它另有一整套：卡上記憶體的配置</text>
  <text x="620" y="476" font-size="11.5" fill="#5a6472">管理與專屬混音控制。同時期其他音效</text>
  <text x="620" y="494" font-size="11.5" fill="#5a6472">函式庫也都得為它另闢一條路。</text>

  <rect x="26" y="518" width="868" height="84" rx="8" fill="#f4f6f8" stroke="#d0d5dd"/>
  <text x="42" y="542" font-size="12.5" fill="#1f2933">兩處用的是同一個手法：變動的部分（音效卡、模組格式）各自一支，中間用一個穩定的介面或格式擋住，</text>
  <text x="42" y="562" font-size="12.5" fill="#1f2933">核心只面對那個穩定的東西。支援一種新格式的成本是「寫一支載入器」，不是「改播放核心」。</text>
  <text x="42" y="588" font-size="12" fill="#8a2b2b">本圖只根據原始碼的結構與標頭；沒有編譯、沒有實跑，授權也不允許反組譯這套函式庫。</text>
</svg>
