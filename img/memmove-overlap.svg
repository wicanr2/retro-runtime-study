<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
<rect x="0" y="0" width="700" height="560" fill="#ffffff"/>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
</marker>
<marker id="aro" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#c2410c"/>
</marker>
<pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
<rect width="6" height="6" fill="#ffedd5"/>
<line x1="0" y1="0" x2="0" y2="6" stroke="#c2410c" stroke-width="1.5"/>
</pattern>
</defs>
<g font-size="14" fill="#0f172a" text-anchor="middle">
<text x="350" y="24">memmove 四種相對位置：只問目的起點落在哪</text>
<rect x="180" y="34" width="14" height="14" fill="#ffedd5" stroke="#c2410c" stroke-width="1"/>
<text x="252" y="46" font-size="11">＝目的</text>
<rect x="300" y="34" width="14" height="14" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
<text x="372" y="46" font-size="11">＝來源</text>
<rect x="420" y="34" width="14" height="14" fill="url(#hatch)" stroke="#c2410c" stroke-width="1"/>
<text x="492" y="46" font-size="11">＝重疊區</text>
<text x="350" y="62" font-size="11" fill="#475569">左＝低位址 → 右＝高位址</text>
<!-- case A -->
<text x="60" y="100" font-size="13" text-anchor="start">A．目的在前</text>
<rect x="200" y="80" width="200" height="30" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<rect x="320" y="80" width="200" height="30" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="260" y="101" font-size="12">dst（低位址）</text>
<text x="425" y="101" font-size="12">src（高位址）</text>
<path d="M 210,134 L 480,134" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="345" y="128" font-size="11" fill="#475569">1 → 2 → 3 前進（CopyUp）</text>
<text x="345" y="150" font-size="11" fill="#475569">尾巴相疊也走這路；完全分離同</text>
<rect x="540" y="114" width="110" height="26" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="595" y="132" font-size="12">走前進</text>
<!-- case B -->
<text x="60" y="190" font-size="13" text-anchor="start">B．目的在後重疊</text>
<rect x="200" y="170" width="200" height="30" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<rect x="280" y="170" width="200" height="30" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<rect x="280" y="170" width="120" height="30" fill="url(#hatch)" stroke="#c2410c" stroke-width="1"/>
<text x="238" y="191" font-size="12">src</text>
<text x="430" y="191" font-size="12">dst（高位址）</text>
<path d="M 470,224 L 200,224" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#aro)"/>
<text x="335" y="218" font-size="11" fill="#475569">倒搬：std 設倒走 → rep movsb → cld 還原</text>
<rect x="540" y="204" width="110" height="26" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="595" y="222" font-size="12">走倒搬</text>
<!-- case C -->
<text x="60" y="280" font-size="13" text-anchor="start">C．相等或相接</text>
<rect x="200" y="260" width="120" height="30" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<rect x="200" y="260" width="120" height="30" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
<text x="260" y="281" font-size="11">dst＝src</text>
<rect x="340" y="260" width="70" height="30" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<rect x="410" y="260" width="70" height="30" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="410" y="281" font-size="11">相接</text>
<path d="M 210,314 L 480,314" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="345" y="308" font-size="11" fill="#475569">无實質重疊，前進正確</text>
<rect x="540" y="294" width="110" height="26" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="595" y="312" font-size="12">走前進</text>
<!-- case D -->
<text x="60" y="370" font-size="13" text-anchor="start">D．目的在後分離</text>
<rect x="200" y="350" width="120" height="30" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="260" y="371" font-size="12">src</text>
<rect x="380" y="350" width="120" height="30" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="440" y="371" font-size="12">dst（遠）</text>
<text x="345" y="398" font-size="11" fill="#475569">dst＞src＋count，无重疊</text>
<rect x="540" y="354" width="110" height="26" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="595" y="372" font-size="12">走前進</text>
<!-- checks near/far -->
<rect x="120" y="416" width="220" height="124" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="230" y="440" font-size="13">near：直接比位移</text>
<text x="230" y="462" font-size="11" fill="#475569">① cmp di,si／jbe</text>
<text x="230" y="480" font-size="11" fill="#475569">目的在前（含等於）→ 前進</text>
<text x="230" y="502" font-size="11" fill="#475569">② src＋count 比 dst／jae</text>
<text x="230" y="520" font-size="11" fill="#475569">相接分離 → 前進，否则倒搬</text>
<rect x="360" y="416" width="220" height="124" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="470" y="440" font-size="13">far：交 ahdiff 算差</text>
<text x="470" y="462" font-size="11" fill="#475569">DX:AX＝線性 dst−src</text>
<text x="470" y="480" font-size="11" fill="#475569">負（目的在前）→ 前進</text>
<text x="470" y="502" font-size="11" fill="#475569">差 ≥ count → 前進</text>
<text x="470" y="520" font-size="11" fill="#475569">否则倒搬（同邏輯、不同演算）</text>
</g>
</svg>
