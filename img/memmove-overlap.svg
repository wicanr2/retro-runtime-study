<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
<rect x="0" y="0" width="700" height="430" fill="#ffffff"/>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
</marker>
<marker id="aro" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#c2410c"/>
</marker>
</defs>
<g font-size="14" fill="#0f172a" text-anchor="middle">
<text x="350" y="26">memmove 三種相對位置：只問目的起點落在哪</text>
<!-- case A -->
<text x="90" y="66" font-size="13" text-anchor="start">A．目的在前</text>
<rect x="200" y="46" width="200" height="30" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<rect x="320" y="46" width="200" height="30" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="260" y="67" font-size="12">dst（低位址）</text>
<text x="425" y="67" font-size="12">src（高位址）</text>
<path d="M 210,100 L 480,100" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="345" y="94" font-size="11" fill="#475569">1 → 2 → 3 前進（CopyUp）</text>
<rect x="540" y="80" width="110" height="26" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="595" y="98" font-size="12">走前進</text>
<!-- case B -->
<text x="90" y="156" font-size="13" text-anchor="start">B．目的在後重疊</text>
<rect x="200" y="136" width="200" height="30" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<rect x="280" y="136" width="200" height="30" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="238" y="157" font-size="12">src（低位）</text>
<text x="382" y="157" font-size="12">dst（高位址）</text>
<path d="M 470,190 L 200,190" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#aro)"/>
<text x="335" y="184" font-size="11" fill="#475569">3 → 2 → 1 倒搬（std／cld）</text>
<rect x="540" y="170" width="110" height="26" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="595" y="188" font-size="12">走倒搬</text>
<!-- case C -->
<text x="90" y="246" font-size="13" text-anchor="start">C．相等或相接</text>
<rect x="200" y="226" width="200" height="30" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="300" y="247" font-size="12">dst＝src／dst＝src＋count</text>
<path d="M 210,280 L 480,280" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="345" y="274" font-size="11" fill="#475569">无實質重疊，前進正確</text>
<rect x="540" y="260" width="110" height="26" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="595" y="278" font-size="12">走前進</text>
<!-- checks -->
<rect x="150" y="310" width="400" height="88" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="350" y="334" font-size="13">兩關判斷（near／far 同式）</text>
<text x="350" y="356" font-size="12" fill="#475569">① cmp di,si／jbe：目的在前（含等於）→ 前進</text>
<text x="350" y="378" font-size="12" fill="#475569">② dst−src ≥ count（far 交 ahdiff 算差）→ 前進，否则倒搬</text>
</g>
</svg>
