<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="#ffffff"/>
  <style>
    text { font-family: 'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif; fill: #222; }
    .title { font-size: 15px; font-weight: bold; }
    .ms { fill: #eef4fb; stroke: #4b7bb5; stroke-width: 1; }
    .bo { fill: #fff4ea; stroke: #d97706; stroke-width: 1; }
    .label { font-size: 13px; }
    .small { font-size: 11px; fill: #666; }
    .mono { font-family: ui-monospace,Consolas,monospace; }
    .head { font-size: 13px; font-weight: bold; }
  </style>

  <text x="30" y="30" class="title">邊界行為對照（far 資料版，★ = 兩家分歧處）</text>

  <rect x="30" y="50" width="320" height="44" rx="6" class="ms"/>
  <text x="190" y="77" text-anchor="middle" class="head">Microsoft（VC++ 1.0）</text>
  <rect x="350" y="50" width="320" height="44" rx="6" class="bo"/>
  <text x="510" y="77" text-anchor="middle" class="head">Borland（C++ 2.0）</text>

  <rect x="30" y="104" width="320" height="80" rx="6" class="ms"/>
  <text x="190" y="128" text-anchor="middle" class="label">空指標：無檢查</text>
  <text x="190" y="148" text-anchor="middle" class="small">從段位址 0 開始掃（未實測）</text>
  <text x="190" y="166" text-anchor="middle" class="small mono">★</text>
  <rect x="350" y="104" width="320" height="80" rx="6" class="bo"/>
  <text x="510" y="128" text-anchor="middle" class="label">空指標：直接回 0</text>
  <text x="510" y="148" text-anchor="middle" class="small">只擋 0:0；0:非零仍掃段零</text>
  <text x="510" y="166" text-anchor="middle" class="small mono">★</text>

  <rect x="30" y="194" width="320" height="80" rx="6" class="ms"/>
  <text x="190" y="218" text-anchor="middle" class="label">64K 無結束符：回 65535</text>
  <text x="190" y="238" text-anchor="middle" class="small mono">jne 跳過 dec（實測）</text>
  <text x="190" y="256" text-anchor="middle" class="small mono">★</text>
  <rect x="350" y="194" width="320" height="80" rx="6" class="bo"/>
  <text x="510" y="218" text-anchor="middle" class="label">64K 無結束符：回 65534</text>
  <text x="510" y="238" text-anchor="middle" class="small">無飽和分支（dosgolem 實測）</text>
  <text x="510" y="256" text-anchor="middle" class="small mono">★</text>

  <rect x="30" y="284" width="320" height="80" rx="6" class="ms"/>
  <text x="190" y="308" text-anchor="middle" class="label">DI 保存：原始碼手寫</text>
  <text x="190" y="328" text-anchor="middle" class="small mono">mov dx,di … mov di,dx</text>
  <text x="190" y="346" text-anchor="middle" class="small">DX 原值丟失</text>
  <rect x="350" y="284" width="320" height="80" rx="6" class="bo"/>
  <text x="510" y="308" text-anchor="middle" class="label">DI 保存：編譯器產生</text>
  <text x="510" y="328" text-anchor="middle" class="small mono">push di … pop di</text>
  <text x="510" y="346" text-anchor="middle" class="small">DX 原值保留</text>
</svg>
