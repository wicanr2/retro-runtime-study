<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470">
  <rect width="700" height="470" fill="#ffffff"/>
  <style>
    text { font-family: 'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif; fill: #222; }
    .title { font-size: 15px; font-weight: bold; }
    .box { fill: #eef4fb; stroke: #4b7bb5; stroke-width: 1; }
    .hot { fill: #fff4ea; stroke: #d97706; stroke-width: 1; }
    .label { font-size: 12px; }
    .small { font-size: 11px; fill: #666; }
    .tiny { font-size: 10px; fill: #666; }
    .mono { font-family: ui-monospace,Consolas,monospace; }
    .arrow { stroke: #4b7bb5; stroke-width: 1.5; marker-end: url(#ah); }
    .side { stroke: #999; stroke-width: 1.5; stroke-dasharray: 5,3; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4b7bb5"/>
    </marker>
  </defs>

  <text x="30" y="30" class="title">三層塔：ios 存狀態 → istream／ostream 格式化 → streambuf 搬位元組</text>

  <rect x="30" y="50" width="420" height="90" rx="6" class="box"/>
  <text x="240" y="72" text-anchor="middle" class="label">頂層 ios：狀態格式本</text>
  <text x="240" y="92" text-anchor="middle" class="small mono">state（eof1／fail2／bad4）＋ flags／precision6／width0／fill空格</text>
  <text x="240" y="110" text-anchor="middle" class="small">x_tie 繫流；x_delbuf 1 才刪底；xalloc／bitalloc 配自定槽</text>
  <text x="240" y="128" text-anchor="middle" class="tiny">無 buf 建構 state 即 badbit；解構打回 badbit</text>

  <rect x="30" y="160" width="420" height="90" rx="6" class="box"/>
  <text x="240" y="182" text-anchor="middle" class="label">中層 istream／ostream：前後綴夾格式化</text>
  <text x="240" y="202" text-anchor="middle" class="small mono">ipfx：驗態 → 刷繫流（need==0 或 need&gt;in_avail）→ 吃空白，留鎖</text>
  <text x="240" y="220" text-anchor="middle" class="small mono">opfx：驗態 → 恆刷繫流，留鎖；osfx：寬歸零 → unitbuf 刷 → 解鎖</text>
  <text x="240" y="238" text-anchor="middle" class="tiny">isfx 只是解雙鎖；unitbuf 敗是賦值 fail|bad（舊態全丟）</text>

  <rect x="30" y="270" width="420" height="108" rx="6" class="hot"/>
  <text x="240" y="292" text-anchor="middle" class="label">底層 streambuf：八指標兩旗一快取（overflow／underflow 雙純虛）</text>
  <text x="240" y="312" text-anchor="middle" class="small mono">保留 _base／_ebuf（512）＋ 寫 _pbase／_pptr／_epptr</text>
  <text x="240" y="330" text-anchor="middle" class="small mono">讀 _eback／_gptr／_egptr ＋ _fAlloc／_fUnbuf／x_lastc</text>
  <text x="240" y="348" text-anchor="middle" class="small">sputc 快路直存、滿調 overflow；無緩衝讀只動 x_lastc 單字快取</text>
  <text x="240" y="366" text-anchor="middle" class="tiny">xsputn 逐字（UNDONE 待優）、xsgetn 區塊 memcpy；sync 預設有字即 EOF</text>

  <line x1="240" y1="140" x2="240" y2="158" class="arrow"/>
  <line x1="240" y1="250" x2="240" y2="268" class="arrow"/>

  <rect x="480" y="50" width="190" height="95" rx="6" class="box"/>
  <text x="575" y="72" text-anchor="middle" class="label">落地一 filebuf</text>
  <text x="575" y="92" text-anchor="middle" class="small mono">_read／_write／_lseek</text>
  <text x="575" y="110" text-anchor="middle" class="small">open 模式翻譯</text>
  <text x="575" y="128" text-anchor="middle" class="tiny">外來 fd 只 sync 不關</text>

  <rect x="480" y="160" width="190" height="95" rx="6" class="box"/>
  <text x="575" y="182" text-anchor="middle" class="label">落地二 strstreambuf</text>
  <text x="575" y="202" text-anchor="middle" class="small mono">動靜雙模記憶體</text>
  <text x="575" y="220" text-anchor="middle" class="small">增一不倍增</text>
  <text x="575" y="238" text-anchor="middle" class="tiny">sync 恆 0</text>

  <rect x="480" y="270" width="190" height="95" rx="6" class="box"/>
  <text x="575" y="292" text-anchor="middle" class="label">落地三 stdiobuf</text>
  <text x="575" y="312" text-anchor="middle" class="small mono">包 FILE* 配 fread 等</text>
  <text x="575" y="330" text-anchor="middle" class="small">換底總機專用</text>
  <text x="575" y="348" text-anchor="middle" class="tiny">無顯式區 hack 半分</text>

  <text x="30" y="392" class="small">四物：cin／cout／cerr／clog 各一檔 new filebuf(0／1／2／2)，init_seg(compiler) 早建，哨兵繫 cout（cerr 加 unitbuf）。</text>
  <text x="30" y="412" class="small">換底：sync_with_stdio 首次調用四物全換 stdiobuf（cout／cerr 寫區 80、clog 512），sunk_with_stdio 守門一次。</text>
  <text x="30" y="432" class="tiny">鎖：每物一 CS（LockFlg 負才鎖）＋ 全域 x_lockc 守 xalloc；單緒四鎖函全空殼；Win32s 下四物與換底全滅。</text>
  <text x="30" y="452" class="tiny">Alpha 版 48 項零差異（cmp 全過）；操縱子 dec／hex／oct、endl／ends 全住標頭行內，原始檔無實體。</text>
</svg>
