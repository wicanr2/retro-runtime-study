<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8710A"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#ffffff"/>

  <!-- 欄標題 -->
  <rect x="15" y="15" width="330" height="62" rx="8" fill="#f3f4f6" stroke="#bbb"/>
  <text x="180" y="41" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">16 位元：DOS 與 Windows 3.x</text>
  <text x="180" y="64" font-size="13" text-anchor="middle" fill="#555">指標 2 或 4 bytes，依記憶體模型而定</text>
  <rect x="355" y="15" width="300" height="62" rx="8" fill="#f3f4f6" stroke="#bbb"/>
  <text x="505" y="41" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">32 位元 DOS 保護模式</text>
  <text x="505" y="64" font-size="13" text-anchor="middle" fill="#555">經 DOS extender 取得平面位址</text>
  <rect x="665" y="15" width="320" height="62" rx="8" fill="#f3f4f6" stroke="#bbb"/>
  <text x="825" y="41" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">32 位元 Win32</text>
  <text x="825" y="64" font-size="13" text-anchor="middle" fill="#555">作業系統直接提供平面位址</text>

  <!-- Borland -->
  <rect x="15" y="95" width="330" height="160" rx="10" fill="#ffffff" stroke="#888"/>
  <text x="30" y="121" font-size="16" font-weight="bold" fill="#222">Borland C++ 2.0 RTL（1991）</text>
  <text x="30" y="147" font-size="14" fill="#E8710A" font-weight="bold">按記憶體模型 × DOS／Windows 分份</text>
  <text x="30" y="171" font-size="14" fill="#333">C 函式庫 CS／CC／CM／CL／CH.LIB</text>
  <text x="30" y="192" font-size="14" fill="#333">數學 MATHS～MATHH、Windows 版 CWIN*</text>
  <text x="30" y="213" font-size="14" fill="#333">（Windows 版不建 huge model）</text>
  <text x="30" y="239" font-size="13" fill="#666">C＋內嵌組語 161 檔、純組語 44 檔</text>

  <!-- VC 1.0 -->
  <rect x="15" y="270" width="330" height="160" rx="10" fill="#ffffff" stroke="#888"/>
  <text x="30" y="296" font-size="16" font-weight="bold" fill="#222">Visual C++ 1.0 CRT（1993）</text>
  <text x="30" y="322" font-size="14" fill="#E8710A" font-weight="bold">按記憶體模型 × DOS／Win EXE／Win DLL</text>
  <text x="30" y="346" font-size="14" fill="#333">SLIBCR、SLIBCW、SDLLCW⋯</text>
  <text x="30" y="367" font-size="14" fill="#333">浮點另成一組庫，不附原始碼</text>
  <text x="30" y="414" font-size="13" fill="#666">組語 359 檔、C 134 檔</text>

  <!-- DSMI -->
  <rect x="15" y="445" width="330" height="125" rx="10" fill="#ffffff" stroke="#888"/>
  <text x="30" y="471" font-size="16" font-weight="bold" fill="#222">DSMI（1992–1994）</text>
  <text x="30" y="497" font-size="14" fill="#E8710A" font-weight="bold">按音效卡分驅動模組，按語言分介面</text>
  <text x="30" y="520" font-size="14" fill="#333">Pascal 單元與 C 標頭並存</text>
  <text x="30" y="541" font-size="14" fill="#333">Pascal 端編真實模式與 DPMI 兩種目標</text>
  <text x="30" y="560" font-size="13" fill="#666">Pascal 97 檔、C 43 檔、組語 38 檔</text>

  <!-- DMX -->
  <rect x="355" y="95" width="300" height="180" rx="10" fill="#ffffff" stroke="#888"/>
  <text x="370" y="121" font-size="16" font-weight="bold" fill="#222">DMX（1993–1994）</text>
  <text x="370" y="147" font-size="14" fill="#E8710A" font-weight="bold">只按建置變體分份</text>
  <text x="370" y="171" font-size="14" fill="#333">DEBUG／BETA／PROD</text>
  <text x="370" y="195" font-size="14" fill="#333">Watcom C 32 位元 flat model</text>
  <text x="370" y="216" font-size="14" fill="#333">＋TASM：即時混音、真實模式中斷</text>
  <text x="370" y="259" font-size="13" fill="#666">3.4a：C 35 檔、組語 6 檔</text>

  <!-- VC 2.0 -->
  <rect x="665" y="95" width="320" height="180" rx="10" fill="#ffffff" stroke="#888"/>
  <text x="680" y="121" font-size="16" font-weight="bold" fill="#222">Visual C++ 2.0 CRT（1994）</text>
  <text x="680" y="147" font-size="14" fill="#E8710A" font-weight="bold">按執行緒與連結方式分份</text>
  <text x="680" y="171" font-size="14" fill="#333">單執行緒 LIBC、多執行緒 LIBCMT</text>
  <text x="680" y="192" font-size="14" fill="#333">CRT DLL（Win32 與 Win32s 各一）</text>
  <text x="680" y="216" font-size="14" fill="#333">x86 與 Alpha 各一包</text>
  <text x="680" y="259" font-size="13" fill="#666">x86：C 475 檔、組語 40 檔、預編 .OBJ 200 個</text>

  <!-- 結論箭頭 -->
  <line x1="360" y1="330" x2="975" y2="330" stroke="#E8710A" stroke-width="2.5" marker-end="url(#arrO)"/>
  <rect x="380" y="350" width="595" height="96" rx="10" fill="#fff4ea" stroke="#E8710A" stroke-width="2"/>
  <text x="400" y="380" font-size="16" fill="#222">指標寬度固定成 32 位元之後，「記憶體模型」這條軸消失，</text>
  <text x="400" y="406" font-size="16" fill="#222">函式庫改按執行緒、連結方式、除錯與否分份。</text>
  <text x="400" y="432" font-size="14" fill="#555">16 位元的兩家都得為每種記憶體模型各編一份。</text>

  <text x="380" y="480" font-size="13" fill="#777">檔案數取自各封存解出的原始檔；年份取自檔頭版權年與封存內時間戳。</text>
</svg>
