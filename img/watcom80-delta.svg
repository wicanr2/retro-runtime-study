<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#ffffff"/>
  <style>
    text { font-family: 'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif; fill: #222; }
    .title { font-size: 15px; font-weight: bold; }
    .box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1; }
    .new { fill: #fff4ea; stroke: #d97706; stroke-width: 1; }
    .back { fill: #fef2f2; stroke: #dc2626; stroke-width: 1; }
    .small { font-size: 11px; fill: #666; }
    .label { font-size: 13px; }
    .mono { font-family: ui-monospace,Consolas,monospace; }
  </style>

  <text x="30" y="28" class="title">Watcom 386 工具鏈：8.0 補齊、9.01 實驗、9.5 回歸</text>

  <!-- 7.0 -->
  <rect x="30" y="50" width="195" height="130" rx="6" class="box"/>
  <text x="127" y="72" text-anchor="middle" class="label mono">7.0（1989）</text>
  <text x="127" y="94" text-anchor="middle" class="small">WCC386＋外部碼產生器 386WCG</text>
  <text x="127" y="112" text-anchor="middle" class="small">函式庫 CSTART3R → __CMain</text>
  <text x="127" y="134" text-anchor="middle" class="small">沒有連結器、沒有函式庫管理器</text>
  <text x="127" y="156" text-anchor="middle" class="small">extender 外購（Phar Lap／OS/386）</text>

  <!-- 8.0 -->
  <rect x="255" y="50" width="195" height="130" rx="6" class="new"/>
  <text x="352" y="72" text-anchor="middle" class="label mono">8.0（1990）</text>
  <text x="352" y="94" text-anchor="middle" class="small">WLINK、WLIB 首次隨附</text>
  <text x="352" y="112" text-anchor="middle" class="small">WCC386P、WVIDEO、WPROF</text>
  <text x="352" y="134" text-anchor="middle" class="small">NetWare NLM／Btrieve 支援</text>
  <text x="352" y="156" text-anchor="middle" class="small">CSTART → __CMain；clib3r 327 模組</text>

  <!-- 9.01 -->
  <rect x="480" y="50" width="195" height="130" rx="6" class="new"/>
  <text x="577" y="72" text-anchor="middle" class="label mono">9.01（1992）</text>
  <text x="577" y="94" text-anchor="middle" class="small">DOS4GW 隨編譯器附</text>
  <text x="577" y="112" text-anchor="middle" class="small">WSTUB／WOMP／RC 進包裝</text>
  <text x="577" y="134" text-anchor="middle" class="small">CSTART → __OS2Main（Family API）</text>
  <text x="577" y="156" text-anchor="middle" class="small">clib3r 334 模組；DOS＝OS/2</text>

  <!-- 9.5 -->
  <rect x="705" y="50" width="195" height="130" rx="6" class="back"/>
  <text x="802" y="72" text-anchor="middle" class="label mono">9.5（1993）</text>
  <text x="802" y="94" text-anchor="middle" class="small">CSTART → __CMain（回歸）</text>
  <text x="802" y="112" text-anchor="middle" class="small">DOS/4GW 專屬符號進啟動模組</text>
  <text x="802" y="134" text-anchor="middle" class="small">Family API 包裝模組全數消失</text>
  <text x="802" y="156" text-anchor="middle" class="small">clib3r 369 模組；16 位元目標回歸</text>

  <!-- 箭頭 -->
  <path d="M 225 115 L 251 115" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 450 115 L 476 115" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 675 115 L 701 115" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <!-- 底部：不變與變化 -->
  <rect x="30" y="200" width="870" height="90" rx="6" class="box"/>
  <text x="50" y="226" class="label">跨版不變：386 碼產生器是外部程式（386WCG → 386WCGL）；編譯器是 16 位元宿主產 32 位元碼；helper 主幹（__STK／__IsTable／__ModF）穩定</text>
  <text x="50" y="250" class="label">函式庫容器的演變：8.0 裸 OMF → 9.01 磁片上 WPK 包 OMF 庫 → 9.5 函式庫檔自身 WPK 壓縮（開頭 03 24）</text>
  <text x="50" y="274" class="small">8.0 的 obj 就引用 _cstart_——「目的檔從函式庫拉啟動模組」的機制在 8.0 已存在（HELLO.obj EXT：__STK／printf／_cstart_）</text>

  <!-- RE 指紋 -->
  <rect x="30" y="306" width="870" height="96" rx="6" class="back"/>
  <text x="50" y="332" class="label">RE 指紋</text>
  <text x="50" y="356" class="label mono">__x386_zero_base_selector／__GDAptr／__D16Infoseg 任一出現 → 9.5 以後的 DOS/4GW 程式</text>
  <text x="50" y="380" class="label mono">庫內啟動呼叫 __OS2Main → 9.01；WLINK／WLIB 存在 → 8.0 起工具鏈自足</text>
</svg>
