<text x="474.0" y="415" font-size="13" text-anchor="middle" fill="#E8710A">1Ah 當檔尾，之後不再讀</text>
<text x="40" y="470" font-size="13" fill="#444">檔案位置倒回 1Ah 那一格（ftell ＝ 3），該代號設「已到檔尾」旗標；之後的寫入會清掉它。二進位模式不做這一切。</text>
<rect x="40" y="480" width="880" height="130" rx="6" fill="#f3f4f6" stroke="#999"/>
<text x="56" y="508" font-size="16" font-weight="bold" fill="#222">ftell 怎麼補償緩衝區</text>
<text x="56" y="532" font-size="13" fill="#333">1. 問 DOS 目前的位置（緩衝區裡那一段還沒送出或還沒消化）</text>
<text x="56" y="552" font-size="13" fill="#333">2. 算緩衝區裡未消化的位元組數：寫入方向是「緩衝區大小 ＋ level ＋ 1」，讀取方向是 |level|</text>
<text x="56" y="572" font-size="13" fill="#333">3. 文字模式再掃一次緩衝區，每個 \n 加 1（它在檔案裡是兩個位元組）</text>
<text x="56" y="592" font-size="13" fill="#333">4. 寫入方向把補償值加上去、讀取方向減掉 → 得到檔案裡的位置</text>
</svg>