<rect x="250" y="596" width="18" height="14" rx="3" fill="#f3f4f6" stroke="#999" stroke-dasharray="4 3"/><text x="276" y="608" font-size="13" fill="#444">加 -O 時刪除</text>
<text x="30" y="636" font-size="13" fill="#444">加 -1：有區域變數的函式改成 C8 02 00 00（enter 2,0）與 C9（leave），取代「55 8B EC 4C 4C」與「8B E5 5D」。</text>
