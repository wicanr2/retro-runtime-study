<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
<rect width="1000" height="660" fill="#ffffff"/>
<text x="30" y="38" font-size="20" font-weight="bold" fill="#222">同一個函式在三種記憶體模型下的進出位元組</text>
<text x="30" y="64" font-size="14" fill="#555">cg_locals：一個 int 參數、2 bytes 區域變數、用到 SI。預設選項，位元組取自 BCC 直接產生的目的檔。</text>
<text x="465" y="104" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">small（compact 同）</text>
<text x="465" y="124" font-size="13" text-anchor="middle" fill="#555">near 呼叫</text>
<text x="675" y="104" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">large（medium 同）</text>
<text x="675" y="124" font-size="13" text-anchor="middle" fill="#555">far 呼叫</text>
<text x="885" y="104" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">huge</text>
<text x="885" y="124" font-size="13" text-anchor="middle" fill="#555">far 呼叫、每模組一個資料段</text>
<text x="350" y="165" font-size="14" text-anchor="end" fill="#333">建立框架</text>
<rect x="370" y="143" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="465" y="159" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">55 8B EC</text>
<text x="465" y="173" font-size="11" text-anchor="middle" fill="#666">push bp; mov bp,sp</text>
<rect x="580" y="143" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="675" y="159" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">55 8B EC</text>
<text x="675" y="173" font-size="11" text-anchor="middle" fill="#666">push bp; mov bp,sp</text>
<rect x="790" y="143" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="885" y="159" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">55 8B EC</text>
<text x="885" y="173" font-size="11" text-anchor="middle" fill="#666">push bp; mov bp,sp</text>
<text x="350" y="205" font-size="14" text-anchor="end" fill="#333">配置 2 bytes 區域變數</text>
<rect x="370" y="183" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="465" y="199" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">4C 4C</text>
<text x="465" y="213" font-size="11" text-anchor="middle" fill="#666">dec sp ×2</text>
<rect x="580" y="183" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="675" y="199" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">4C 4C</text>
<text x="675" y="213" font-size="11" text-anchor="middle" fill="#666">dec sp ×2</text>
<rect x="790" y="183" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="885" y="199" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">4C 4C</text>
<text x="885" y="213" font-size="11" text-anchor="middle" fill="#666">dec sp ×2</text>
<text x="350" y="245" font-size="14" text-anchor="end" fill="#333">保存暫存器變數</text>
