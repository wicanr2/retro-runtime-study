<text x="465" y="239" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">56</text>
<text x="465" y="253" font-size="11" text-anchor="middle" fill="#666">push si</text>
<rect x="580" y="223" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="675" y="239" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">56</text>
<text x="675" y="253" font-size="11" text-anchor="middle" fill="#666">push si</text>
<rect x="790" y="223" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="885" y="239" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">56</text>
<text x="885" y="253" font-size="11" text-anchor="middle" fill="#666">push si</text>
<text x="350" y="285" font-size="14" text-anchor="end" fill="#333">載入本模組資料段</text>
<line x1="430" y1="280" x2="500" y2="280" stroke="#ccc" stroke-dasharray="4 4"/>
<line x1="640" y1="280" x2="710" y2="280" stroke="#ccc" stroke-dasharray="4 4"/>
<rect x="790" y="263" width="190" height="34" rx="4" fill="#fff4ea" stroke="#E8710A" stroke-width="2"/>
<text x="885" y="279" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">1E B8 ?? ?? 8E D8</text>
<text x="885" y="293" font-size="11" text-anchor="middle" fill="#666">push ds; mov ax,段; mov ds,ax</text>
<text x="350" y="325" font-size="14" text-anchor="end" fill="#333">本體：讀第一個參數</text>
<rect x="370" y="303" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="465" y="319" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">8B 46 04</text>
<text x="465" y="333" font-size="11" text-anchor="middle" fill="#666">mov ax,[bp+4]</text>
<rect x="580" y="303" width="190" height="34" rx="4" fill="#fff4ea" stroke="#E8710A" stroke-width="2"/>
<text x="675" y="319" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">8B 46 06</text>
<text x="675" y="333" font-size="11" text-anchor="middle" fill="#666">mov ax,[bp+6]</text>
<rect x="790" y="303" width="190" height="34" rx="4" fill="#fff4ea" stroke="#E8710A" stroke-width="2"/>
<text x="885" y="319" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">8B 46 06</text>
<text x="885" y="333" font-size="11" text-anchor="middle" fill="#666">mov ax,[bp+6]</text>
<text x="350" y="365" font-size="14" text-anchor="end" fill="#333">跳到共用出口</text>
<rect x="370" y="343" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
<text x="465" y="359" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">EB 00</text>
<text x="465" y="373" font-size="11" text-anchor="middle" fill="#666">jmp short $+2</text>
<rect x="580" y="343" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
<text x="675" y="359" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">EB 00</text>
<text x="675" y="373" font-size="11" text-anchor="middle" fill="#666">jmp short $+2</text>
<rect x="790" y="343" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
<text x="885" y="359" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">EB 00</text>
<text x="885" y="373" font-size="11" text-anchor="middle" fill="#666">jmp short $+2</text>
<text x="350" y="405" font-size="14" text-anchor="end" fill="#333">還原 DS</text>
<line x1="430" y1="400" x2="500" y2="400" stroke="#ccc" stroke-dasharray="4 4"/>
<line x1="640" y1="400" x2="710" y2="400" stroke="#ccc" stroke-dasharray="4 4"/>
<rect x="790" y="383" width="190" height="34" rx="4" fill="#fff4ea" stroke="#E8710A" stroke-width="2"/>
<text x="885" y="399" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">1F</text>
<text x="885" y="413" font-size="11" text-anchor="middle" fill="#666">pop ds</text>
<text x="350" y="445" font-size="14" text-anchor="end" fill="#333">還原暫存器變數</text>
<rect x="370" y="423" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="465" y="439" font-size="14" font-family="'DejaVu Sans Mono','Consolas',monospace" text-anchor="middle" fill="#222">5E</text>
<text x="465" y="453" font-size="11" text-anchor="middle" fill="#666">pop si</text>
<rect x="580" y="423" width="190" height="34" rx="4" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
