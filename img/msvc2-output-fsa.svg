<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430">
  <rect width="700" height="430" fill="#ffffff"/>
  <style>
    text { font-family: 'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif; fill: #222; }
    .title { font-size: 15px; font-weight: bold; }
    .box { fill: #eef4fb; stroke: #4b7bb5; stroke-width: 1; }
    .hot { fill: #fff4ea; stroke: #d97706; stroke-width: 1; }
    .label { font-size: 12px; }
    .small { font-size: 11px; fill: #666; }
    .tiny { font-size: 10px; fill: #666; }
    .mono { font-family: ui-monospace,Consolas,monospace; }
    .arrow { stroke: #4b7bb5; stroke-width: 1.5; marker-end: url(#bh); }
    .plain { stroke: #4b7bb5; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="bh" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4b7bb5"/>
    </marker>
  </defs>

  <text x="30" y="30" class="title">_output 三建一機：查表八態，輸出原語抽換</text>

  <rect x="30" y="50" width="640" height="120" rx="6" class="box"/>
  <text x="350" y="72" text-anchor="middle" class="label">同一份 OUTPUT.C 編三遍（前端共用、後端抽換）</text>
  <text x="130" y="100" text-anchor="middle" class="small mono">_output</text>
  <text x="130" y="118" text-anchor="middle" class="tiny">_putc_lk</text>
  <text x="350" y="100" text-anchor="middle" class="small mono">_woutput（WPRFLAG＋UNICODE）</text>
  <text x="350" y="118" text-anchor="middle" class="tiny">_putwc_lk</text>
  <text x="570" y="100" text-anchor="middle" class="small mono">靜態 output（CPRFLAG）</text>
  <text x="570" y="118" text-anchor="middle" class="tiny">_putch_lk（_cprintf 用）</text>
  <text x="350" y="142" text-anchor="middle" class="small">共用：八態（一般／%／旗／寬／點／精／尺寸／型）＋ __lookuptable</text>
  <text x="350" y="160" text-anchor="middle" class="tiny">表雙合一：低 nibble 字類、高 nibble 次態（maketabc.c 產，不在封存）</text>

  <rect x="30" y="190" width="310" height="130" rx="6" class="hot"/>
  <text x="185" y="212" text-anchor="middle" class="label">三個非常規轉角</text>
  <text x="185" y="232" text-anchor="middle" class="small">前導位元組：DBCS 直送不斷字</text>
  <text x="185" y="252" text-anchor="middle" class="small">I＋前看 64：否則退回重吐 I</text>
  <text x="185" y="272" text-anchor="middle" class="small">L 旗：x86 留註不編、Alpha 恆編</text>
  <text x="185" y="292" text-anchor="middle" class="tiny">（L 恆表 __int64）</text>
  <text x="185" y="308" text-anchor="middle" class="tiny">%Z＝NT 計數串（私貨）</text>

  <rect x="360" y="190" width="310" height="130" rx="6" class="box"/>
  <text x="515" y="212" text-anchor="middle" class="label">_input：點陣掃描集＋浮點兩段</text>
  <text x="515" y="232" text-anchor="middle" class="small mono">%[]：32 位元組點陣（窄）</text>
  <text x="515" y="252" text-anchor="middle" class="small">寬版表 ×256（8192 位元組）</text>
  <text x="515" y="272" text-anchor="middle" class="small mono">浮點：掃進 floatstring[350]</text>
  <text x="515" y="292" text-anchor="middle" class="tiny">再 _fassign（＝_cfltcvt_tab[2]）落值</text>
  <text x="515" y="308" text-anchor="middle" class="tiny">寬版先 wcstombs 轉窄再餵</text>

  <line x1="350" y1="170" x2="200" y2="188" class="plain"/>
  <line x1="350" y1="170" x2="500" y2="188" class="plain"/>

  <text x="30" y="348" class="small">%C／%S 鏡像：窄版無旗預設寬、寬版無旗預設窄；%s 自掃（精度內可無 NUL），空指標印 (null)。</text>
  <text x="30" y="368" class="small">浮點六步：精度預設 6 → _cfltcvt → # 補點 → g 去尾零 → 摘負號 → 量長。</text>
  <text x="30" y="388" class="tiny">註：%n 按 LONG／SHORT 落 long／short／int；%p＝2×sizeof(void*) 大寫 hex 零填。</text>
  <text x="30" y="408" class="tiny">註：_snprintf＝#define _COUNT_＋包 sprintf.c（14 行，第四式）。</text>
</svg>
