<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
<rect width="1000" height="840" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<text x="30" y="38" font-size="20" font-weight="bold" fill="#222">判斷一支 DOS 程式的 runtime：由便宜到昂貴逐層檢查</text>
<text x="30" y="64" font-size="14" fill="#555">左欄是要看的東西，右欄是讀到的結論。每一層都可能被抹掉，所以後面的層用來確認前面的結論。</text>
<rect x="40" y="95" width="360" height="85" rx="6" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="54" y="119" font-size="15" font-weight="bold" fill="#222">0　壓縮了嗎</text>
<text x="54" y="141" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">字串 Packed file is corrupt／PKLITE／LZ91；重定位項目 0</text>
<rect x="470" y="95" width="490" height="85" rx="6" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="484" y="119" font-size="15" font-weight="bold" fill="#222"></text>
<text x="484" y="141" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">壓縮過 → 先用解壓工具還原</text>
<text x="484" y="161" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">還原後檔頭會被重寫，沒有 FB 不代表不是 Borland</text>
<line x1="400" y1="137.5" x2="468" y2="137.5" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="220" y1="180" x2="220" y2="218" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="220" width="360" height="85" rx="6" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="54" y="244" font-size="15" font-weight="bold" fill="#222">1　連結器標記</text>
<text x="54" y="266" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">MZ 檔頭 1Ch–1Fh、e_lfarlc（18h）</text>
<rect x="470" y="220" width="490" height="85" rx="6" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="484" y="244" font-size="15" font-weight="bold" fill="#222"></text>
<text x="484" y="266" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">01 00 FB 30、e_lfarlc＝3Eh → BC++ 2.0 附的 TLINK 4.0</text>
<text x="484" y="286" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">FB 50、FB 61 → 其他版本的 TLINK（對應未證實）</text>
<line x1="400" y1="262.5" x2="468" y2="262.5" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="220" y1="305" x2="220" y2="343" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="345" width="360" height="85" rx="6" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="54" y="369" font-size="15" font-weight="bold" fill="#222">2　啟動碼</text>
<text x="54" y="391" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">進入點位元組、C0 的字串</text>
<rect x="470" y="345" width="490" height="85" rx="6" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="484" y="369" font-size="15" font-weight="bold" fill="#222"></text>
<text x="484" y="391" font-size="13" font-family="'DejaVu Sans Mono','Consolas',monospace" fill="#333">BA ?? ?? 2E 89 16 ?? ?? B4 30 CD 21 → Borland C 的 C0</text>
<text x="484" y="411" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">8C CA … → tiny；Null pointer assignment → small／medium</text>
<line x1="400" y1="387.5" x2="468" y2="387.5" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="220" y1="430" x2="220" y2="468" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="470" width="360" height="85" rx="6" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="54" y="494" font-size="15" font-weight="bold" fill="#222">3　函式庫簽章</text>
<text x="54" y="516" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">dos.json、scroll-1991-08.json 的命中</text>
<rect x="470" y="470" width="490" height="85" rx="6" fill="#fff4ea" stroke="#E8710A" stroke-width="2"/>
<text x="484" y="494" font-size="15" font-weight="bold" fill="#222"></text>
<text x="484" y="516" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">只屬於單一函式庫的命中最多者 → 記憶體模型（20／20）</text>
<text x="484" y="536" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">__SCROLL 命中哪一份 → 1991-04 或 1991-08 版</text>
<line x1="400" y1="512.5" x2="468" y2="512.5" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="220" y1="555" x2="220" y2="593" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="595" width="360" height="85" rx="6" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="54" y="619" font-size="15" font-weight="bold" fill="#222">4　產生碼</text>
<text x="54" y="641" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">ret／retf、[bp+4]／[bp+6]、les、ss: 前綴、DS 載入</text>
<rect x="470" y="595" width="490" height="85" rx="6" fill="#f3f4f6" stroke="#999" stroke-width="1"/>
<text x="484" y="619" font-size="15" font-weight="bold" fill="#222"></text>
<text x="484" y="641" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">near／far 程式碼 × near／far 資料 → 模型</text>
<text x="484" y="661" font-size="13" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#333">EB 00、pop cx、值表搜尋 → BCC 的習慣</text>
<line x1="400" y1="637.5" x2="468" y2="637.5" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="720" width="920" height="96" rx="6" fill="#ffffff" stroke="#bbb" stroke-dasharray="6 4"/>
<text x="56" y="746" font-size="15" font-weight="bold" fill="#222">常見的抹除</text>
<text x="56" y="770" font-size="13" fill="#444">解壓工具重寫檔頭 → 第 1 層看不到；Turbo Pascal 程式也有 Borland 字串 → 第 2 層要看是不是 C0</text>
<text x="56" y="790" font-size="13" fill="#444">overlay 程式（BCC.EXE）、進入點不是 C0（TLINK、TASM）→ 第 2 層看不到，IDA 也不會自動套函式庫簽章</text>
<text x="56" y="810" font-size="13" fill="#444">幾乎不用 C 函式庫的程式 → 第 3 層命中很少；這時靠第 4 層</text>
</svg>