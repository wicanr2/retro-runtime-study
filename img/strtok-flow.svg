<svg xmlns="http://www.w3.org/2000/svg" width="700" height="510" viewBox="0 0 700 510" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
<rect x="0" y="0" width="700" height="510" fill="#ffffff"/>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
</marker>
</defs>
<g font-size="14" fill="#0f172a" text-anchor="middle">
<!-- start -->
<rect x="240" y="8" width="160" height="30" rx="15" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="320" y="28">開始：string, 分隔符集</text>
<line x1="320" y1="38" x2="320" y2="52" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- build -->
<rect x="150" y="52" width="340" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="320" y="74">建表：分隔符集→256 位元表</text>
<text x="320" y="95" font-size="12" fill="#475569">每次重建（分隔符集可換）</text>
<line x1="320" y1="108" x2="320" y2="122" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- dispatch diamond -->
<path d="M320,122 L430,156 L320,190 L210,156 Z" fill="#fff7ed" stroke="#334155" stroke-width="1.5"/>
<text x="320" y="151" font-size="13">string＝NULL？</text>
<text x="320" y="167" font-size="11" fill="#475569">續掃 or 新串</text>
<text x="308" y="210" font-size="12" fill="#475569">是</text>
<line x1="320" y1="190" x2="320" y2="204" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="448" y="151" font-size="12" fill="#475569">否</text>
<line x1="430" y1="156" x2="470" y2="156" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="470" y="128" width="160" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="550" y="150" font-size="12">用新串</text>
<text x="550" y="168" font-size="12">SI 指新串頭</text>
<line x1="550" y1="184" x2="550" y2="226" stroke="#334155" stroke-width="1.5"/>
<line x1="550" y1="226" x2="454" y2="226" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- skip -->
<rect x="190" y="204" width="260" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="320" y="223">跳前導分隔符</text>
<text x="320" y="241" font-size="12" fill="#475569">空欄不產 token</text>
<line x1="320" y1="248" x2="320" y2="262" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- end diamond -->
<path d="M320,262 L430,296 L320,330 L210,296 Z" fill="#fff7ed" stroke="#334155" stroke-width="1.5"/>
<text x="320" y="291" font-size="13">撞結束符？</text>
<text x="320" y="307" font-size="11" fill="#475569">掃完？</text>
<text x="308" y="350" font-size="12" fill="#475569">否</text>
<line x1="320" y1="330" x2="320" y2="344" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="448" y="291" font-size="12" fill="#475569">是</text>
<line x1="430" y1="296" x2="470" y2="296" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="470" y="272" width="160" height="48" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="550" y="292" font-size="12">掃完</text>
<text x="550" y="310" font-size="12">回傳 NULL</text>
<line x1="630" y1="296" x2="662" y2="296" stroke="#334155" stroke-width="1.5"/>
<line x1="662" y1="296" x2="662" y2="483" stroke="#334155" stroke-width="1.5"/>
<line x1="662" y1="483" x2="404" y2="483" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- collect -->
<rect x="170" y="344" width="300" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="320" y="366">收藏 token 到分隔符</text>
<text x="320" y="387" font-size="12" fill="#475569">寫 NUL 斷尾（破壞性）</text>
<line x1="320" y1="400" x2="320" y2="414" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- store -->
<rect x="190" y="414" width="260" height="40" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="320" y="439">存 token＝斷尾處，回傳 token 頭</text>
<line x1="320" y1="454" x2="320" y2="468" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="240" y="468" width="160" height="30" rx="15" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="320" y="488">結束</text>
</g>
</svg>
