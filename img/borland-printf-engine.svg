<svg xmlns="http://www.w3.org/2000/svg" width="940" height="650" viewBox="0 0 940 650" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="940" height="650" fill="#ffffff"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a94a6"/>
    </marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 上半：輸出 -->
  <text x="26" y="34" font-size="15" font-weight="bold" fill="#1f2933">輸出：一個引擎，三個輸出函式</text>

  <g font-size="13" fill="#1f2933">
    <rect x="26" y="58" width="160" height="52" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="106" y="79" text-anchor="middle">printf、fprintf</text>
    <text x="106" y="97" text-anchor="middle" font-size="12" fill="#5a6472">vprintf、vfprintf</text>

    <rect x="26" y="122" width="160" height="52" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="106" y="143" text-anchor="middle">sprintf</text>
    <text x="106" y="161" text-anchor="middle" font-size="12" fill="#5a6472">vsprintf</text>

    <rect x="26" y="186" width="160" height="52" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="106" y="217" text-anchor="middle">cprintf</text>
  </g>
  <text x="26" y="262" font-size="12" fill="#5a6472">呼叫時各自帶一個輸出函式</text>

  <path d="M186,84 L242,138" stroke="#8a94a6" fill="none" marker-end="url(#ar)"/>
  <path d="M186,148 L242,148" stroke="#8a94a6" fill="none" marker-end="url(#ar)"/>
  <path d="M186,212 L242,158" stroke="#8a94a6" fill="none" marker-end="url(#ar)"/>

  <!-- 引擎 -->
  <rect x="250" y="56" width="356" height="196" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="1.6"/>
  <text x="428" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4b00">__vprinter</text>
  <text x="428" y="99" text-anchor="middle" font-size="12" fill="#5a6472">( 輸出函式, 輸出對象, 格式字串, 引數區 )</text>

  <rect x="266" y="110" width="324" height="30" rx="6" fill="#ffffff" stroke="#e3c79b"/>
  <text x="280" y="130" font-size="12.5" fill="#1f2933">字元分類表：0x20–0x7F 共 96 項，查表跳轉</text>

  <rect x="266" y="146" width="324" height="46" rx="6" fill="#ffffff" stroke="#e3c79b"/>
  <text x="280" y="165" font-size="12.5" fill="#1f2933">解析七階段：旗標 → 補零 → 寬度 → 小數點</text>
  <text x="280" y="183" font-size="12.5" fill="#1f2933">→ 精度 → 長度修飾 → 型別</text>

  <rect x="266" y="198" width="324" height="44" rx="6" fill="#ffffff" stroke="#e3c79b"/>
  <text x="280" y="216" font-size="12.5" fill="#1f2933">內部緩衝區 80 bytes</text>
  <text x="280" y="233" font-size="11.5" fill="#5a6472">滿了或結束時呼叫輸出函式，一次呼叫可能送出多批</text>

  <!-- 出口 -->
  <path d="M606,120 L620,120 L620,84 L640,84" stroke="#d97706" fill="none" marker-end="url(#aro)"/>
  <path d="M606,152 L640,152" stroke="#d97706" fill="none" marker-end="url(#aro)"/>
  <path d="M606,188 L620,188 L620,218 L640,218" stroke="#d97706" fill="none" marker-end="url(#aro)"/>

  <g font-size="13" fill="#1f2933">
    <rect x="648" y="58" width="266" height="54" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="662" y="79" font-size="12.5" font-weight="bold" fill="#8a4b00">__fputn</text>
    <text x="662" y="99" font-size="12.5">寫進串流，對象是 FILE *</text>

    <rect x="648" y="122" width="266" height="54" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="662" y="143" font-size="12.5" font-weight="bold" fill="#8a4b00">strputn</text>
    <text x="662" y="163" font-size="12.5">複製到字串，結尾補 \0</text>

    <rect x="648" y="186" width="266" height="54" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="662" y="207" font-size="12.5" font-weight="bold" fill="#8a4b00">__cputn</text>
    <text x="662" y="227" font-size="12.5">送到主控台，不經 stdout 緩衝</text>
  </g>

  <line x1="26" y1="288" x2="914" y2="288" stroke="#e3e6eb"/>

  <!-- 下半：輸入 -->
  <text x="26" y="322" font-size="15" font-weight="bold" fill="#1f2933">輸入：同一手法的鏡像</text>

  <g font-size="13" fill="#1f2933">
    <rect x="26" y="344" width="160" height="44" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="106" y="371" text-anchor="middle">sscanf</text>

    <rect x="26" y="398" width="160" height="52" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="106" y="419" text-anchor="middle">scanf、fscanf</text>
    <text x="106" y="437" text-anchor="middle" font-size="12" fill="#5a6472">vscanf、vfscanf</text>

    <rect x="26" y="460" width="160" height="44" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="106" y="487" text-anchor="middle">cscanf</text>
  </g>
  <text x="26" y="528" font-size="12" fill="#5a6472">呼叫時各自帶一對取字元函式</text>

  <path d="M186,366 L242,414" stroke="#8a94a6" fill="none" marker-end="url(#ar)"/>
  <path d="M186,424 L242,424" stroke="#8a94a6" fill="none" marker-end="url(#ar)"/>
  <path d="M186,482 L242,434" stroke="#8a94a6" fill="none" marker-end="url(#ar)"/>

  <rect x="250" y="344" width="356" height="160" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="1.6"/>
  <text x="428" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4b00">_scanner</text>
  <text x="428" y="387" text-anchor="middle" font-size="12" fill="#5a6472">( Get, UnGet, 來源, 格式字串, 變數指標陣列 )</text>
  <rect x="266" y="400" width="324" height="86" rx="6" fill="#ffffff" stroke="#e3c79b"/>
  <text x="280" y="420" font-size="12.5" fill="#1f2933">解析邏輯只認得兩個動作：</text>
  <text x="280" y="440" font-size="12.5" fill="#1f2933">「再給我一個字元」與「這個還你」。</text>
  <text x="280" y="463" font-size="12.5" fill="#1f2933">來源是字串、檔案還是鍵盤，</text>
  <text x="280" y="480" font-size="12.5" fill="#1f2933">解析端不知道也不必知道。</text>

  <path d="M606,412 L620,412 L620,370 L640,370" stroke="#d97706" fill="none" marker-end="url(#aro)"/>
  <path d="M606,424 L640,424" stroke="#d97706" fill="none" marker-end="url(#aro)"/>
  <path d="M606,440 L620,440 L620,484 L640,484" stroke="#d97706" fill="none" marker-end="url(#aro)"/>

  <g font-size="12.5" fill="#1f2933">
    <rect x="648" y="344" width="266" height="52" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="662" y="365" font-weight="bold" fill="#8a4b00">Get／UnGet</text>
    <text x="662" y="384">走字串（各檔自己的靜態函式）</text>

    <rect x="648" y="398" width="266" height="52" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="662" y="419" font-weight="bold" fill="#8a4b00">_Nfgetc／_Nungetc</text>
    <text x="662" y="438">走串流</text>

    <rect x="648" y="458" width="266" height="52" rx="8" fill="#f8f9fb" stroke="#d0d5dd"/>
    <text x="662" y="479" font-weight="bold" fill="#8a4b00">_Ngetche／_Nungetch</text>
    <text x="662" y="498">走主控台</text>
  </g>

  <rect x="26" y="556" width="888" height="70" rx="8" fill="#f4f6f8" stroke="#d0d5dd"/>
  <text x="42" y="580" font-size="12.5" fill="#1f2933">代價：格式與引數對不上時引擎救不回來——引數指標已經多走或少走了幾個位元組。</text>
  <text x="42" y="602" font-size="12.5" fill="#1f2933">於是它從出問題的那個 % 開始，把格式字串當一般文字印出來，沒有錯誤回傳值。</text>
</svg>
