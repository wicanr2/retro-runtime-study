<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="940" height="720" fill="#ffffff"/>

  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a94a6"/>
    </marker>
    <marker id="e2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="26" y="32" font-size="15" font-weight="bold" fill="#1f2933">32 位元 DOS 程式的三層：誰負責哪一段</text>

  <!-- 左：分層 -->
  <rect x="26" y="52" width="420" height="292" rx="8" fill="#fbfcfd" stroke="#d0d5dd"/>

  <rect x="42" y="70" width="388" height="56" rx="6" fill="#fff8f0" stroke="#d97706"/>
  <text x="58" y="92" font-size="12.5" font-weight="bold" fill="#8a4b00">你的程式（32 位元，flat）</text>
  <text x="58" y="112" font-size="11.5" fill="#5a6472">Watcom 編譯、Watcom 的函式庫與啟動碼</text>

  <path d="M236,126 L236,144" stroke="#d97706" fill="none" marker-end="url(#e2)"/>

  <rect x="42" y="148" width="388" height="76" rx="6" fill="#eef4fb" stroke="#b9cfe6" stroke-width="1.6"/>
  <text x="58" y="170" font-size="12.5" font-weight="bold" fill="#1f2933">DOS extender（別家的產品）</text>
  <text x="58" y="190" font-size="11.5" fill="#5a6472">切進保護模式、建描述符、接管中斷</text>
  <text x="58" y="208" font-size="11.5" fill="#5a6472">呼叫 DOS 時把參數搬到 1 MB 以下再切回實模式</text>

  <path d="M236,224 L236,242" stroke="#8a94a6" fill="none" marker-end="url(#e1)"/>

  <rect x="42" y="246" width="388" height="52" rx="6" fill="#f4f6f8" stroke="#dfe3e8"/>
  <text x="58" y="268" font-size="12.5" fill="#1f2933">MS-DOS（16 位元實模式）</text>
  <text x="58" y="288" font-size="11.5" fill="#5a6472">檔案、鍵盤、記憶體區塊——只認得段:位移</text>

  <text x="42" y="322" font-size="11.5" fill="#8a2b2b">編譯器廠商只賣中間那層以上；extender 要另外買。</text>

  <!-- 右上：依附有多深 -->
  <rect x="462" y="52" width="452" height="292" rx="8" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="478" y="76" font-size="13" font-weight="bold" fill="#1f2933">依附有多深：連 PSP 在哪都是約定的</text>

  <text x="478" y="102" font-size="11.5" fill="#5a6472">16 位元：程式啟動時 DS／ES 就指著 PSP</text>

  <rect x="478" y="116" width="420" height="72" rx="6" fill="#fbfcfd" stroke="#d0d5dd"/>
  <text x="494" y="138" font-size="11.5" fill="#1f2933">保護模式：段暫存器放的是描述符編號，不是位址</text>
  <text x="494" y="160" font-size="11.5" fill="#8a4b00">Phar Lap　PSP 的選擇器 ＝ 24h</text>
  <text x="494" y="178" font-size="11.5" fill="#8a4b00">Lahey／OS/386　PSP 的選擇器 ＝ 0fh</text>

  <text x="478" y="212" font-size="11.5" fill="#5a6472">同一份啟動碼用條件編譯二選一。</text>

  <text x="478" y="242" font-size="12.5" font-weight="bold" fill="#1f2933">環境變了，兩件事就不必做了</text>
  <text x="478" y="266" font-size="11.5" fill="#1f2933">不再把多的記憶體還給 DOS</text>
  <text x="494" y="284" font-size="11" fill="#5a6472">記憶體歸 extender 管，程式不是持有者</text>
  <text x="478" y="306" font-size="11.5" fill="#1f2933">不再掃空指標哨兵</text>
  <text x="494" y="324" font-size="11" fill="#5a6472">保護模式自己會攔（推論）</text>

  <!-- 中下：helper 消長 -->
  <rect x="26" y="360" width="888" height="212" rx="8" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="42" y="384" font-size="13" font-weight="bold" fill="#1f2933">helper 的消長：哪些複雜度來自硬體限制</text>

  <rect x="42" y="398" width="420" height="156" rx="6" fill="#fdecec" stroke="#d98080"/>
  <text x="58" y="420" font-size="12.5" font-weight="bold" fill="#8a2b2b">32 位元之後消失的</text>
  <text x="58" y="444" font-size="11.5" fill="#1f2933">__PTS ／ __PTC　far 指標相減、比較</text>
  <text x="74" y="462" font-size="11" fill="#5a6472">flat 沒有段，各變成一道指令</text>
  <text x="58" y="486" font-size="11.5" fill="#1f2933">__PIA ／ __PIS ／ __PCA ／ __PCS</text>
  <text x="74" y="504" font-size="11" fill="#5a6472">指標加減整數，不必再折回段裡</text>
  <text x="58" y="528" font-size="11.5" fill="#1f2933">__I4M ／ __I4D　32 位元乘除</text>
  <text x="74" y="546" font-size="11" fill="#5a6472">386 有原生指令</text>

  <rect x="478" y="398" width="420" height="156" rx="6" fill="#eef4fb" stroke="#b9cfe6"/>
  <text x="494" y="420" font-size="12.5" font-weight="bold" fill="#1f2933">留下來的</text>
  <text x="494" y="444" font-size="11.5" fill="#1f2933">__STK　堆疊檢查</text>
  <text x="510" y="462" font-size="11" fill="#5a6472">每個函式開頭一次（實測）</text>
  <text x="494" y="486" font-size="11.5" fill="#1f2933">__I4FS ／ __U4FS ／ __ModF　浮點轉換</text>
  <text x="510" y="504" font-size="11" fill="#5a6472">整數與浮點互轉仍要軟體做</text>
  <text x="494" y="528" font-size="11.5" fill="#1f2933">__IsTable　ctype 分類表</text>
  <text x="510" y="546" font-size="11" fill="#5a6472">與架構無關</text>

  <!-- 底 -->
  <rect x="26" y="588" width="888" height="110" rx="8" fill="#f4f6f8" stroke="#d0d5dd"/>
  <text x="42" y="612" font-size="12.5" fill="#1f2933">留下來的三組，留下的理由都與位元寬度無關；消失的兩組，一組是段造成的，一組是 16 位元算術造成的。</text>
  <text x="42" y="636" font-size="12.5" fill="#1f2933">兩種呼叫慣例的啟動碼各 8.8 KB、差 83 行，而差的幾乎全是符號名——流程一行都沒變。</text>
  <text x="42" y="660" font-size="12.5" fill="#1f2933">實測：自己編一支程式，printf 走堆疊由呼叫端收拾，固定參數的函式才走暫存器。</text>
  <text x="42" y="686" font-size="12" fill="#8a2b2b">本圖只根據原廠文件、原廠附的啟動碼原始碼，與自己編譯後反組譯的產物；不做位元組簽章。</text>
</svg>
